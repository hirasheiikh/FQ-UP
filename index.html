:root{
  /* light theme, tuned for contrast: darker text and borders, a slightly darker page so white cards stand out */
  --bg:#E1EAE7; --surface:#FFFFFF; --sunk:#EAF1EF; --ink:#0F201D; --muted:#3A5651; --line:#B3C9C3;
  --teal:#00897B; --teal-deep:#00665C; --teal-ink:#FFFFFF; --teal-soft:#C6EAE4;
  --coral:#C84E1F; --coral-soft:#F8D3C3; --gold:#B87608; --gold-soft:#FAE5AA;
  --good:#1E7343; --good-soft:#C6E9D3; --warn:#A8600C; --warn-soft:#F8DDB0;
  --t1:#BDE8E0; --t2:#F8D4C3; --t3:#CFDCF5; --t4:#EEDFB4;
  --heading:"Outfit","Nunito",system-ui,sans-serif;
  --body:"Nunito","Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1615; --surface:#122320; --sunk:#0E1D1A; --ink:#E2EFEB; --muted:#90A8A3; --line:#213733;
  --teal:#00A898; --teal-deep:#005F56; --teal-ink:#FFFFFF; --teal-soft:#153733;
  --coral:#F2946A; --coral-soft:#392218; --gold:#E5A93D; --gold-soft:#342B14;
  --good:#57C486; --good-soft:#173425; --warn:#E4A648; --warn-soft:#352914;
  --t1:#153530; --t2:#352219; --t3:#1C2438; --t4:#302816; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1615; --surface:#122320; --sunk:#0E1D1A; --ink:#E2EFEB; --muted:#90A8A3; --line:#213733;
  --teal:#00A898; --teal-deep:#005F56; --teal-ink:#FFFFFF; --teal-soft:#153733;
  --coral:#F2946A; --coral-soft:#392218; --gold:#E5A93D; --gold-soft:#342B14;
  --good:#57C486; --good-soft:#173425; --warn:#E4A648; --warn-soft:#352914;
  --t1:#153530; --t2:#352219; --t3:#1C2438; --t4:#302816; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.48;
  padding:14px;display:flex;justify-content:center;align-items:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}

/* Desktop Presentation Layout */
.wrap{width:100%;max-width:1180px;height:95vh;max-height:920px;display:flex;gap:36px;align-items:center;justify-content:center}
aside.pitch{display:none;flex:1;max-width:480px;height:100%;overflow-y:auto;padding:12px 14px 20px}
@media (min-width:960px){aside.pitch{display:block}}
.pitch h1{font-family:var(--heading);font-size:34px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;color:var(--teal)}
.pitch .by{color:var(--muted);margin:0 0 16px;font-size:14px}
.pitch .badge-tr{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:12px}
.pitch h2{font-family:var(--heading);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:20px 0 8px;font-weight:700}
.pitch ul{margin:0;padding-left:18px;display:grid;gap:6px}
.pitch li span{color:var(--muted);font-size:13px}
.quick-controls{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* Phone Mockup Frame */
.phone-case{
  width:100%;max-width:414px;height:100%;max-height:860px;background:#000;
  border-radius:48px;padding:11px;box-shadow:0 22px 60px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.1);
  display:flex;flex-direction:column;position:relative;flex-shrink:0
}
.phone-island{
  position:absolute;top:19px;left:50%;transform:translateX(-50%);
  width:108px;height:24px;background:#000;border-radius:20px;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.phone-island .cam{width:10px;height:10px;border-radius:50%;background:#131c26}
.phone-island .mic{width:7px;height:7px;border-radius:50%;background:#09121c}

.app{
  width:100%;height:100%;background:var(--surface);border-radius:38px;
  display:flex;flex-direction:column;overflow:hidden;position:relative
}

/* Status Bar */
.status-bar{
  height:44px;padding:12px 22px 0;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:800;font-family:var(--heading);color:var(--teal-ink);
  background:var(--teal);z-index:10;user-select:none
}
.status-icons{display:flex;gap:6px;align-items:center}
.status-icons svg{width:15px;height:15px}

/* Top Navigation Bar */
header.top{
  background:var(--teal);color:var(--teal-ink);padding:6px 14px 12px;
  display:grid;grid-template-columns:42px 1fr 42px;align-items:center;z-index:10;
}
header.top h1{
  margin:0;text-align:center;font-family:var(--heading);font-size:19px;font-weight:700;
  letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.hbtn{background:none;border:0;color:inherit;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.hbtn:active{transform:scale(.92)}
.hbtn svg{width:22px;height:22px}

main{flex:1;overflow-y:auto;padding:14px 16px 30px;scroll-behavior:smooth}
nav.tabs{
  display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:var(--surface);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:10
}
nav.tabs button{
  background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--muted);padding:4px 0;border-radius:12px;font-weight:700;transition:all .15s ease
}
nav.tabs button[aria-current="page"]{color:var(--teal);font-weight:800}
nav.tabs button:active{transform:scale(.92)}
nav.tabs svg{width:22px;height:22px}

/* Headings & Layout */
h2.sec{font-family:var(--heading);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:4px 0 6px;text-wrap:balance}
h3{font-family:var(--heading);font-size:17px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 8px}
.stack{display:grid;gap:10px}
.card{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0}
.btn{
  border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--teal);color:var(--teal-ink);
  text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, background .12s
}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--sunk)}
.btn.coral{background:var(--coral);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tip{font-size:13px;color:var(--muted);border-left:3.5px solid var(--coral);padding:4px 0 4px 10px;margin:14px 0 0}
.alert{background:var(--coral-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alert b{color:var(--coral)}

/* Companion Mascot Bar */
.mascot-bar{
  background:var(--teal-soft);border-radius:var(--r);padding:10px 14px;display:flex;
  align-items:center;gap:12px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--teal) 25%,transparent)
}
.mascot-img{width:48px;height:48px;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,168,152,.2))}
.mascot-text b{font-family:var(--heading);font-size:15px;color:var(--teal);font-weight:800}
.mascot-text p{margin:2px 0 0;font-size:12px;color:var(--ink);opacity:.9}
.mascot-pts{margin-left:auto;text-align:right;flex-shrink:0}
.mascot-pts span{font-family:var(--heading);font-weight:800;font-size:19px;color:var(--teal)}
.mascot-pts small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}

/* Home Modules Grid */
.today{display:flex;gap:14px;align-items:center}
.ring{width:70px;height:70px;flex:none}
.ring text{font-family:var(--heading);font-weight:800;fill:var(--ink)}
.big{font-family:var(--heading);font-size:18px;font-weight:800;margin:0}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod{border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;text-align:left;display:grid;gap:4px;background:var(--surface);transition:all .14s ease}
.mod:active{transform:scale(.96);background:var(--sunk)}
.mod .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:2px}
.mod .ic svg{width:24px;height:24px}
.mod b{font-family:var(--heading);font-size:14px;letter-spacing:.02em;text-transform:uppercase;font-weight:800}
.mod span{font-size:12px;color:var(--muted);line-height:1.25}

/* Treatment Page */
.treat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.treat h3{margin:0;font-size:15px}
.treat .meta{color:var(--muted);font-size:13px}
.dots{display:flex;gap:6px;grid-row:1 / span 2;grid-column:2}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--teal);background:transparent;display:grid;place-items:center;color:var(--teal-ink);transition:all .18s ease}
.dot:active{transform:scale(.9)}
.dot[aria-pressed="true"]{background:var(--teal)}
.dot svg{width:18px;height:18px}
.heat{display:grid;grid-template-columns:84px repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:11px}
.heat .h{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.heat .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{aspect-ratio:1;border-radius:6px;background:var(--line);max-width:100%}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.pct{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.pct .bar{grid-column:1 / -1}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1.5px dashed var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted)}
.badge.on{border:1.5px solid var(--teal);background:var(--teal-soft);color:var(--ink);font-weight:800}
.badge svg{width:22px;height:22px;display:block;margin:0 auto 4px;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;text-align:left;font-weight:700;transition:all .12s}
.chip[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:800}
.chip.c[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral)}
textarea,input,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px}
textarea{min-height:80px;resize:vertical}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Biomarker / Clinical Tracker */

.biogrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.bio {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.bio b {
  display: block;
  font-family: var(--heading);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 3px;
}
.bio small {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  line-height: 1.15;
}

.biocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.biocard small{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
.biocard b{font-family:var(--heading);font-size:20px;font-weight:800;color:var(--teal)}
.biocard span{display:block;font-size:10px;color:var(--good);font-weight:800;margin-top:2px}

/* Interactive Timers */
.timer-box{
  background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;
  border-radius:24px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden
}
.breathe-circle{
  width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.2);
  border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:18px 0;transition:transform 4s ease-in-out;position:relative
}
.breathe-circle.inhale{transform:scale(1.22);background:rgba(255,255,255,.3)}
.breathe-circle.hold{transform:scale(1.22);border-color:var(--gold)}
.breathe-circle.exhale{transform:scale(0.88);background:rgba(255,255,255,.1)}
.breathe-instruction{font-family:var(--heading);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.breathe-sub{font-size:13px;opacity:.88}

/* In-App Document Article View */
.doc-article{line-height:1.6}
.doc-article h3{color:var(--teal);margin:18px 0 6px;border-bottom:1.5px solid var(--line);padding-bottom:4px;font-size:17px}
.doc-article p{margin:0 0 10px}
.doc-article ul, .doc-article ol{margin:0 0 12px;padding-left:20px}
.doc-article li{margin-bottom:6px}
.doc-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.doc-table th{background:var(--teal);color:#fff;text-align:left;padding:8px;border-radius:4px 4px 0 0}
.doc-table td{border-bottom:1px solid var(--line);padding:8px}

/* In-App Video Cards */
.video-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .12s, border-color .12s}
.video-card:active{transform:scale(.97);border-color:var(--teal)}
.video-thumb{width:76px;height:52px;background:#182624;border-radius:10px;display:grid;place-items:center;color:#fff;position:relative;flex-shrink:0}
.video-thumb svg{width:24px;height:24px;color:var(--teal-soft)}
.video-meta b{display:block;font-size:14px;margin-bottom:2px;font-weight:700}
.video-meta small{color:var(--teal);font-size:12px;display:flex;align-items:center;gap:4px;font-weight:700}

/* Native Video Player Modal Overlay */
.video-modal-box{background:#000;border-radius:18px;overflow:hidden;position:relative;width:100%;aspect-ratio:16/9;margin-bottom:12px}
.video-modal-box iframe{width:100%;height:100%;border:0}

/* In-App Mini Game: Gotita FQ */
#game-canvas{background:#E6F5F2;border-radius:16px;border:2px solid var(--teal);display:block;margin:10px auto;touch-action:none}
.game-controls{display:flex;justify-content:center;gap:14px;margin-top:10px}
.game-btn{width:64px;height:50px;border-radius:14px;background:var(--teal);color:#fff;border:0;font-size:22px;display:grid;place-items:center}
.game-btn:active{transform:scale(.9)}

/* Action Banner Card */
.doc-banner{background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);border-radius:var(--r);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.doc-banner b{font-family:var(--heading);font-size:15px;color:var(--teal);font-weight:800;display:block}
.doc-banner p{font-size:12px;margin:2px 0 0;color:var(--ink)}

/* Calendar & Events */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:800;padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:transparent;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative;font-size:14px;max-width:100%;font-weight:700}
.cal button.out{color:var(--muted);opacity:.4}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--teal);font-weight:800}
.cal button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:800}
.cal .evd{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .evd i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.item{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center}
.date{background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center;padding:5px 0;font-family:var(--heading);line-height:1.1}
.date b{display:block;font-size:18px;font-weight:800}
.date span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}
.item h4{margin:0;font-size:14px;font-weight:700}
.item p{margin:0;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;border:0}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.due{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line small{display:block;color:var(--muted)}

.steps{counter-reset:s;display:grid;gap:8px;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-weight:800;font-size:12px;display:grid;place-items:center}
.links{display:grid;gap:8px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--surface)}
.lnk small{display:block;color:var(--muted);font-size:12px}
.lnk svg{width:18px;height:18px;color:var(--teal);flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);background:var(--sunk);border:1px solid var(--line);display:grid;gap:2px}
.tile b{font-family:var(--heading);font-size:15px;font-weight:800}
.tile small{color:var(--muted);font-size:12px}
.copybox{white-space:pre-wrap;font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;user-select:all}
details{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--sunk)}
details summary{font-weight:800;cursor:pointer}
details[open] summary{margin-bottom:8px}

/* Mood & Notes */
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;font-size:11px;display:grid;justify-items:center;gap:4px;font-weight:700}
.mood button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);font-weight:800}
.mood i{width:22px;height:22px;border-radius:50%;display:block}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note button.open{background:none;border:0;text-align:left;padding:0}
.note b{display:block;font-weight:700}
.note span{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:none;border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:17px;height:17px}
.fab{position:absolute;right:18px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--coral) 40%,transparent);z-index:3}
.fab svg{width:26px;height:26px}

/* Modal Bottom Sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 20px 28px}
.sheet h2{font-family:var(--heading);margin:2px 0 12px;font-size:22px;font-weight:800}
.sheet .close{float:right}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:40;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-family:var(--heading);font-size:26px;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.toggle input{width:auto;transform:scale(1.25)}

/* Welcome Screen */
.welcome{flex:1;background:linear-gradient(180deg,var(--teal-deep),var(--teal));color:var(--teal-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:32px 24px;text-align:center}
.logo-box{width:88px;height:88px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--teal);font-family:var(--heading);font-weight:900;font-size:38px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.welcome h1{font-family:var(--heading);font-size:32px;font-weight:800;margin:8px 0 0}
.welcome p{max-width:28ch;margin:0;opacity:.92;font-size:14px}
.welcome .btn{background:#fff;color:var(--teal);width:100%;max-width:260px}
.welcome .btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.8);color:#fff}
.auth{padding:24px 20px;display:grid;gap:12px;overflow:auto;flex:1}

@media (max-width:480px){
  body{padding:0;align-items:stretch}
  .wrap{height:100%;max-height:none}
  .phone-case{border-radius:0;padding:0;max-width:none;max-height:none;box-shadow:none}
  .phone-island{display:none}
  .app{border-radius:0}
}

/* Printable Medical Report */
@media print{
  body{background:#fff;color:#000;padding:0}
  .wrap, aside.pitch, .phone-case, .status-bar, nav.tabs, header.top, .fab{display:none!important}
  #print-report{display:block!important;padding:20px;font-family:sans-serif}
}
#print-report{display:none}
@media print{#print-report,#print-report *{-webkit-print-color-adjust:exact;print-color-adjust:exact}#print-report thead tr,#print-report thead th{background:#000!important;color:#fff!important}}

/* === FQ-UP PRO: ENHANCED RESPONSIVE & GLASSMORPHIC STYLING === */
@media (max-width: 680px) {
  body {
    padding: 0 !important;
    background: var(--surface) !important;
    display: block !important;

}

/* Fluid Screen Transitions */
main {

  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
@keyframes viewSlideIn {

}

}

/* Bottom sheet motion: slide-up, backdrop fade, grabber pill */
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes sheetFadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetFadeOut{from{opacity:1}to{opacity:0}}
.sheet-bg{animation:sheetFadeIn .2s ease-out}
.sheet-bg .sheet{animation:sheetUp .32s cubic-bezier(.16,1,.3,1)}
.sheet-bg.closing{animation:sheetFadeOut .22s ease-in forwards;pointer-events:none}
.sheet-bg.closing .sheet{animation:sheetDown .22s ease-in forwards}
.sheet-grabber{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px;touch-action:none}

/* Pro Sheet Close & Timer Centering Fix */
.sheet {

}
.sheet .close {

}
.scroll-x {

.scroll-x::-webkit-scrollbar {

}

/* Hero Carousel Layout */
.hero-carousel {

/* Nav Tabs Dark & Light Mode Sync */

/* Phase 2: Health Mode Selector (Bevel Lesson 3) */
.health-mode-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;

/* Phase 2: Gentler Streak Effort Selector */

/* Phase 2: iOS StandBy Style Nebulizer Timer */

  box-shadow: 0 12px 36px rgba(0,0,0,0.45) !important;
}

.sp-hist{display:grid;gap:0}
.sp-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid #15231f}
.sp-row:first-child{border-top:0}
.sp-dot{flex:none;width:10px;height:10px;border-radius:50%}
.sp-rt{flex:1;min-width:0}
.sp-rt b{display:block;font-size:14px;font-weight:700;color:#E2EFEB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-rt small{display:block;font-size:12px;color:#7C958F;margin-top:1px}
.sp-del{flex:none;background:none;border:1px solid #223532;border-radius:9px;color:#9FB8B3;padding:4px 9px;font-size:13px;min-height:0}
.sp-del[data-armed]{background:#F2946A;color:#fff;border-color:#F2946A}

/* === Gotas FQ page === */
.pt-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 6px;border:1px solid #1c2c29;border-radius:14px}
.pt-stats>div{padding:12px 8px;text-align:center;border-left:1px solid #1c2c29}
.pt-stats>div:first-child{border-left:0}
.pt-stats b{display:block;font-family:var(--heading);font-size:24px;font-weight:600}
.pt-stats span{display:block;font-size:12px;color:#9FB8B3;margin-top:2px}
.pt-pts{flex:none;font-weight:700;font-size:14px;color:#8BE0B0}

/* ===================== Inicio: warm base + immersive pro cards ===================== */
.pro{display:block;font-variant-numeric:tabular-nums}
.pro *{box-sizing:border-box}

/* Hero: dark glass orb card */
.pro-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 16px 14px;margin:2px 0 12px;color:#E2EFEB;
  background:linear-gradient(165deg,#0b1f1d 0%,#080F11 60%);border:1px solid #1c2c29;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.pro-hero>*:not(.orb-blob){position:relative;z-index:1}
.pro-hero .orb-blob{opacity:.5}
.pro-hero .orb-blob.b1{width:150px;height:150px;left:-30px;top:30px}
.pro-hero .orb-blob.b2{width:140px;height:140px;right:-30px;top:70px}
.pro-hero .orb-blob.b3{width:110px;height:110px;left:40%;bottom:60px;opacity:.38}
.pro-hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pro-eyebrow{font-size:13px;font-weight:700;color:#CBE6E9;letter-spacing:.01em}
.pro-pill{font-size:11.5px;font-weight:700;color:#CBE6E9;border:1px solid #2a4440;border-radius:99px;padding:3px 10px;background:rgba(8,15,17,.45)}
.pro-orbwrap{display:grid;place-items:center;height:226px;margin-top:-4px}
.pro-orbwrap .orb{width:210px;height:210px}
.pro-hero-cap{text-align:center;font-size:13px;font-weight:600;color:#CBE6E9;margin:-6px 0 6px}
.pro-hero .lg-dots{margin:8px 0 4px}
.pro-hero-actions{display:grid;gap:8px;margin-top:10px}
.pro-hero-actions .btn{min-height:46px;border-radius:14px;font-size:15px;font-weight:800}
.pro-ghost{background:transparent!important;border:1.5px solid #2a4440!important;color:#E2EFEB!important}
.pro-done{font-size:14px;font-weight:700;color:#8BE0B0;text-align:center;padding:6px 0}

/* Lungs teaser card */
.pro-lungs{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;margin:0 0 6px;padding:14px 8px 14px 18px;border-radius:24px;border:1px solid #1c2c29;color:#E2EFEB;
  background:radial-gradient(120% 120% at 100% 50%,#0f2b29 0%,#080F11 70%);box-shadow:0 14px 34px rgba(0,0,0,.25)}
.pro-lungs-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pro-lungs-txt small{font-size:13px;font-weight:700;color:#CBE6E9}
.pro-lungs-txt b{font-family:var(--heading);font-size:52px;font-weight:300;line-height:1;letter-spacing:-.02em}
.pro-lungs-txt b i{font-style:normal;font-size:18px;color:#7C958F;margin-left:2px}
.pro-state{font-size:13.5px;font-weight:700}
.pro-state.ok{color:#8BE0B0}
.pro-state.warn{color:#F2946A}
.pro-lungs-txt em{font-style:normal;font-size:11.5px;color:#7C958F;margin-top:2px}
.pro-lungs canvas{flex:none;width:156px;height:156px}

/* Signal tiles (warm, coloured) */
.pro-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pro-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:13px 14px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--tb,var(--sunk));min-height:136px;position:relative;color:var(--ink)}
.pro-tic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--tc,var(--teal));margin-bottom:4px}
.pro-tic svg{width:19px;height:19px}
.pro-tl{font-size:12px;font-weight:700;color:var(--muted)}
.pro-tn{font-family:var(--heading);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.pro-tn small{font-size:13px;color:var(--muted);font-weight:600;margin-left:1px}
.pro-ts{font-size:11.5px;color:var(--muted);line-height:1.3}
.pro-spark{width:100%;height:24px;margin-top:auto}
.pro-seg{display:flex;gap:3px;width:100%;margin-top:auto}
.pro-seg i{flex:1;height:7px;border-radius:2px;background:var(--line)}
.pro-seg i.on{background:var(--teal)}

/* Welcome: logo tile on the original teal gradient */
.wl-logo{width:min(230px,66%);background:#fff;border-radius:26px;padding:14px 14px 10px;box-shadow:0 16px 36px rgba(0,0,0,.28)}
.wl-logo img{display:block;width:100%;height:auto}

/* readable mascot title on dark */
:root[data-theme="dark"] .mascot-text b{color:#7EF1DE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mascot-text b{color:#7EF1DE}}
/* ============ Modern pass: ambient glow, layered glass, floating controls ============ */
html body.in-app main{
  background:
    radial-gradient(70% 38% at 12% -4%, color-mix(in srgb,var(--teal) 24%,transparent), transparent 70%),
    radial-gradient(55% 32% at 104% 6%, color-mix(in srgb,var(--coral) 16%,transparent), transparent 70%),
    var(--bg);
}
.label{text-transform:none;letter-spacing:0;font-size:16px;font-weight:700;color:var(--ink);margin:24px 0 10px;font-family:var(--heading)}

/* layered glass cards */
.card,.mod,.pro-tile,.mascot-bar,.health-mode-bar,.alert{
  border-color:color-mix(in srgb,var(--ink) 9%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 10%,transparent), 0 10px 28px rgba(0,0,0,.14);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.mod,.pro-tile{border-radius:22px}
.mod{background:color-mix(in srgb,var(--surface) 78%,transparent)}
.card{background:color-mix(in srgb,var(--sunk) 82%,transparent)}
.mascot-bar{border-radius:22px}
.health-mode-bar{border-radius:999px;padding:8px 14px}

/* pill buttons with glow */
.btn,.sg-btn{border-radius:999px}
.btn:not(.ghost):not(.coral){box-shadow:0 8px 22px color-mix(in srgb,var(--teal) 40%,transparent)}
.btn.sm{border-radius:999px}
.pro-hero-actions .btn{border-radius:999px}

/* floating action pill */
.pro-fab{position:sticky;bottom:10px;z-index:5;display:flex;align-items:center;gap:10px;margin:18px auto 0;padding:13px 22px;border:0;border-radius:999px;
  background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 60%,#0b3d4a));color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 12px 30px color-mix(in srgb,var(--teal) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.pro-fab small{font-size:12px;font-weight:700;opacity:.85;border-left:1px solid rgba(255,255,255,.4);padding-left:10px}
.pro-fab-dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28);animation:fabPulse 2.2s ease-in-out infinite}
@keyframes fabPulse{50%{box-shadow:0 0 0 7px rgba(255,255,255,.08)}}
@media (prefers-reduced-motion:reduce){.pro-fab-dot{animation:none}}

/* floating tab bar */
html body nav.tabs{
  margin:0 12px calc(10px + env(safe-area-inset-bottom,0px))!important;border-radius:28px!important;padding:6px!important;
  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)!important;
  background:color-mix(in srgb,var(--surface) 82%,transparent)!important;
  -webkit-backdrop-filter:blur(22px)!important;backdrop-filter:blur(22px)!important;
  box-shadow:0 14px 34px rgba(0,0,0,.28)!important}
html body nav.tabs button{border-radius:20px;padding:6px 0}
html body nav.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
/* orb numerals: light, clean type */
.orb-led{align-items:baseline!important;justify-content:center!important}
.orb-num{font-family:var(--heading);font-weight:300;color:#F2FBFA;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(115,194,201,.55)}
.led-unit{font-family:var(--heading);font-weight:300!important;font-size:22px!important;margin-bottom:0!important;color:#CBE6E9;margin-left:2px}
/* ---- Hand-wash sheet ---- */
.hw{padding:2px 0 4px;text-align:center;font-variant-numeric:tabular-nums}
.hw canvas{display:block;width:100%;height:230px}
.hw-time{font-family:var(--heading);font-size:68px;font-weight:300;line-height:1;margin-top:-2px;color:#F2FBFA;letter-spacing:-.03em}
.hw-time small{font-size:22px;color:#8FB5BA;margin-left:3px}
.hw-info p{margin:8px 10px 0;font-size:15px;font-weight:600;color:#E2EFEB;min-height:44px;line-height:1.35}
.hw-steps{display:flex;gap:6px;justify-content:center;margin-top:10px}
.hw-steps i{width:26px;height:5px;border-radius:99px;background:#1c2c29;transition:background .3s}
.hw-steps i.on{background:#73C2C9}

/* ---- Video sheet + cards ---- */
.vid{text-align:center;padding:2px 0 4px}
.vid-title{margin:4px 30px 12px;font-family:var(--heading);font-size:17px;font-weight:600;color:#F2FBFA;line-height:1.3}
.vid-frame{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 12px 28px rgba(0,0,0,.4)}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-note{font-size:12px;color:#8FA9AD;margin:10px 0 8px}
.vid-yt{margin-bottom:12px}
.video-card{align-items:center;gap:14px;padding:10px 12px 10px 10px}
.video-thumb{width:112px;height:63px;border-radius:12px;background:#0c1a18 center/cover no-repeat;overflow:hidden;flex-shrink:0;position:relative;display:grid;place-items:center}
.video-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.5))}
.video-thumb svg{position:relative;z-index:1;width:22px;height:22px;color:#fff;fill:#fff;stroke:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.video-meta{min-width:0;flex:1;text-align:left}
.video-meta b{display:block;font-size:14px;line-height:1.3}
.video-meta small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--teal);margin-top:5px;font-weight:700}
.video-meta small svg{width:11px;height:11px;fill:currentColor;stroke:none;flex:none}

/* ---- Welcome: FQ UP wordmark ---- */
.wl-mark{width:min(190px,56%);filter:drop-shadow(0 14px 30px rgba(0,0,0,.25))}
.wl-mark svg{display:block;width:100%;height:auto}

/* ================= Transitions & motion ================= */
/* the old "every render slides in" animation caused flicker on simple updates */
html body main{animation:none!important}

/* View Transitions: only named regions animate; root stays put */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
main{view-transition-name:vt-main}
header.top{view-transition-name:vt-head}
nav.tabs{view-transition-name:vt-nav}
.tab-pill{view-transition-name:vt-pill}
::view-transition-group(vt-nav){animation:none}
::view-transition-old(vt-nav){display:none}
::view-transition-new(vt-nav){animation:none}
::view-transition-old(vt-head),::view-transition-new(vt-head){animation-duration:.26s;mix-blend-mode:normal}
::view-transition-group(vt-pill){animation-duration:.5s;animation-timing-function:cubic-bezier(.34,1.45,.64,1)}
::view-transition-old(vt-pill),::view-transition-new(vt-pill){mix-blend-mode:normal;height:100%}
::view-transition-old(vt-main),::view-transition-new(vt-main){mix-blend-mode:normal;animation-duration:.44s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}

@keyframes vtPushOut{to{opacity:0;transform:translateX(-7%) scale(.955);filter:blur(7px)}}
@keyframes vtPushIn{from{opacity:0;transform:translateX(9%) scale(1.02);filter:blur(9px)}}
@keyframes vtPopOut{to{opacity:0;transform:translateX(9%) scale(1.02);filter:blur(7px)}}
@keyframes vtPopIn{from{opacity:0;transform:translateX(-7%) scale(.955);filter:blur(9px)}}
@keyframes vtFwdOut{to{opacity:0;transform:translateX(-12%);filter:blur(5px)}}
@keyframes vtFwdIn{from{opacity:0;transform:translateX(12%);filter:blur(5px)}}
@keyframes vtBackOut{to{opacity:0;transform:translateX(12%);filter:blur(5px)}}
@keyframes vtBackIn{from{opacity:0;transform:translateX(-12%);filter:blur(5px)}}
@keyframes vtEnterOut{to{opacity:0;transform:scale(1.06);filter:blur(12px)}}
@keyframes vtEnterIn{from{opacity:0;transform:scale(.93);filter:blur(12px)}}
html[data-nav="push"]::view-transition-old(vt-main){animation-name:vtPushOut}
html[data-nav="push"]::view-transition-new(vt-main){animation-name:vtPushIn}
html[data-nav="pop"]::view-transition-old(vt-main){animation-name:vtPopOut}
html[data-nav="pop"]::view-transition-new(vt-main){animation-name:vtPopIn}
html[data-nav="forward"]::view-transition-old(vt-main){animation-name:vtFwdOut}
html[data-nav="forward"]::view-transition-new(vt-main){animation-name:vtFwdIn}
html[data-nav="backward"]::view-transition-old(vt-main){animation-name:vtBackOut}
html[data-nav="backward"]::view-transition-new(vt-main){animation-name:vtBackIn}
html[data-nav="enter"]::view-transition-old(vt-main){animation-name:vtEnterOut}
html[data-nav="enter"]::view-transition-new(vt-main){animation-name:vtEnterIn}
html[data-nav="enter"]::view-transition-old(vt-head),html[data-nav="enter"]::view-transition-new(vt-head){animation-duration:.4s}

/* staggered entrance of the blocks on a page */
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:riseIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms + 80ms)}

/* sliding tab pill */
html body nav.tabs{position:relative}
.tab-pill{grid-row:1;align-self:stretch;margin:0 3px;border-radius:22px;background:color-mix(in srgb,var(--teal) 20%,transparent);z-index:0;pointer-events:none}
html body nav.tabs button{position:relative;z-index:1;grid-row:1}
html body nav.tabs button[aria-current="page"]{background:transparent!important}

/* sheet: the page behind steps back (iOS card feel) */
.app>#screen-container{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s,border-radius .5s;transform-origin:50% 100%}
.app.sheet-open>#screen-container{transform:scale(.945) translateY(8px);filter:brightness(.62) saturate(.9);border-radius:26px;overflow:hidden}

/* check-off: ring ripple + drawn tick */
.dot{position:relative}
@keyframes dotPop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes checkDraw{to{stroke-dashoffset:0}}
@keyframes dotRing{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.dot.just{animation:dotPop .55s cubic-bezier(.34,1.6,.64,1)}
.dot.just svg path,.dot.just svg polyline{stroke-dasharray:28;stroke-dashoffset:28;animation:checkDraw .4s .1s ease-out forwards}
.dot.just::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--teal);animation:dotRing .7s ease-out forwards;pointer-events:none}

/* welcome: kinetic tagline */
.kin{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--heading);font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.01em;margin:2px 0 4px}
.kin-a{position:relative;display:inline-block;animation:kinFade 1s 1.5s ease forwards}
.kin-a::after{content:"";position:absolute;left:-2px;right:-2px;top:54%;height:2.5px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;animation:kinStrike .55s 1.15s cubic-bezier(.7,0,.2,1) forwards}
.kin-b{display:inline-block;animation:kinRise .9s .9s cubic-bezier(.2,.8,.2,1) both}
.kin-b em{font-style:normal;background:linear-gradient(90deg,#7EF1DE,#B9F6C8,#FFD27A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(126,241,222,.35))}
@keyframes kinStrike{to{transform:scaleX(1)}}
@keyframes kinFade{to{opacity:.55}}
@keyframes kinRise{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes wlIn{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.welcome>*:not(.welcome-glow){animation:wlIn .8s cubic-bezier(.2,.8,.2,1) both}
.welcome>*:nth-child(2){animation-delay:.05s}.welcome>*:nth-child(3){animation-delay:.15s}.welcome>*:nth-child(4){animation-delay:.25s}
.welcome>*:nth-child(5){animation-delay:.35s}.welcome>*:nth-child(6){animation-delay:.45s}.welcome>*:nth-child(7){animation-delay:.55s}
.welcome>*:nth-child(8){animation-delay:.65s}.welcome>*:nth-child(9){animation-delay:.75s}

@media (prefers-reduced-motion:reduce){
  .rise,.kin-a,.kin-a::after,.kin-b,.welcome>*{animation:none!important}
  .kin-a::after{transform:scaleX(1)}.kin-a{opacity:.55}
  .app>#screen-container{transition:none}
}

/* ================= Design polish: quick actions, bento modules, video carousel, guides ================= */
.pro{padding-bottom:74px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa-b{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:4px 0;color:var(--ink);font-size:12px;font-weight:700;text-align:center}
.qa-ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 34%,var(--surface)),color-mix(in srgb,var(--c) 10%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.qa-ic svg{width:25px;height:25px}
.qa-b:active .qa-ic{transform:scale(.92)}

/* hand-wash reminder with countdown ring */
.hw-card{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:22px;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 20%,var(--surface)),var(--surface))}
.hw-ringwrap{position:relative;width:56px;height:56px;flex:none}
.hw-ring{width:56px;height:56px;display:block}
.hw-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.hw-ring .bg{stroke:color-mix(in srgb,var(--teal) 18%,transparent)}
.hw-ring .fg{stroke:var(--teal);transition:stroke-dasharray .8s ease}
.hw-ringtxt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--heading);font-size:14px;font-weight:700;color:var(--ink)}
.hw-card-txt{flex:1;min-width:0}
.hw-card-txt b{display:block;font-size:15px}
.hw-card-txt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}

/* bento modules */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bn{position:relative;overflow:hidden;text-align:left;border-radius:24px;padding:14px 14px 15px;min-height:122px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,var(--surface)) 0%,color-mix(in srgb,var(--c) 7%,var(--surface)) 62%,var(--surface) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.14)}
.bn.wide{grid-column:span 2;min-height:116px}
.bn-ic{position:absolute;top:13px;left:13px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.bn-ic svg{width:21px;height:21px}
.bn-w{position:absolute;right:-12px;bottom:-14px;width:92px;height:92px;color:var(--c);opacity:.13;pointer-events:none}
.bn-w svg{width:92px;height:92px;stroke-width:1.4}
.bn b{font-family:var(--heading);font-size:16px;font-weight:700;line-height:1.2;position:relative}
.bn small{font-size:12px;color:var(--muted);line-height:1.3;position:relative;max-width:85%}
.bn-go{position:absolute;top:13px;right:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;color:var(--muted);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.bn:active{transform:scale(.97)}

/* video cards -> media cards, lists -> swipeable carousel */
.video-card{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;border-radius:22px}
.video-thumb{width:100%;height:auto;aspect-ratio:16/9;border-radius:0}
.video-thumb svg{width:46px;height:46px;padding:13px 12px 13px 14px;border-radius:50%;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);box-sizing:border-box;filter:none}
.video-meta{padding:12px 14px 14px}
.video-meta b{font-size:14.5px}
.stack:has(> .video-card){display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.stack:has(> .video-card)::-webkit-scrollbar{display:none}
.stack:has(> .video-card) > .video-card{flex:0 0 78%!important;scroll-snap-align:start;margin:0}
/* video carousels on desktop: visible scrollbar, arrow buttons and drag with the mouse */
.car-nav{display:none}
@media (hover:hover) and (pointer:fine){
  .stack:has(> .video-card){scrollbar-width:thin!important;cursor:grab}
  .stack:has(> .video-card)::-webkit-scrollbar{display:block!important;height:6px}
  .stack:has(> .video-card)::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--teal) 70%,transparent);border-radius:99px}
  .stack:has(> .video-card).dragging{cursor:grabbing;user-select:none}
  .car-nav{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 6px}
  .car-nav span{margin-right:auto;font-size:12px;color:var(--muted);font-weight:700}
  .car-nav button{width:34px;height:30px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink);font-size:18px;line-height:1;padding:0}
  .car-nav button:hover{border-color:var(--teal);color:var(--teal)}
}

/* interactive guide card on the technique pages */
.pro-lungs.guide{margin-bottom:12px}
.pro-lungs.guide .pro-lungs-txt b{font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.pro-lungs.guide .pro-lungs-txt em{margin-top:0;max-width:22ch}
.pro-cta{display:inline-block;margin-top:8px;padding:8px 18px;border-radius:999px;background:var(--teal);color:var(--teal-ink,#fff);font-size:13px;font-weight:800;box-shadow:0 8px 20px color-mix(in srgb,var(--teal) 40%,transparent);align-self:flex-start}

/* document banners */
.doc-banner{border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 22%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--teal) 30%,transparent)}
.doc-banner b{color:var(--ink)}

/* ================= Content pages ================= */
.ph{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin:0 0 14px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 34%,var(--surface)) 0%,color-mix(in srgb,var(--c) 8%,var(--surface)) 66%,var(--surface) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 28px rgba(0,0,0,.16)}
.ph-ic{position:absolute;top:16px;left:16px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 36%,transparent)}
.ph-ic svg{width:23px;height:23px}
.ph-w{position:absolute;right:-14px;bottom:-18px;width:120px;height:120px;color:var(--c);opacity:.14;pointer-events:none}
.ph-w svg{width:120px;height:120px;stroke-width:1.3}
.ph h2{position:relative;margin:0;font-family:var(--heading);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.ph p{position:relative;margin:3px 0 0;font-size:14px;color:var(--muted)}
.lead{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 14px}

/* chips */
.chips{gap:8px}
.chip{border-radius:999px;padding:9px 14px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);font-weight:600}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 62%,#0b3d4a));border-color:transparent;color:var(--teal-ink,#fff);font-weight:800;box-shadow:0 8px 18px color-mix(in srgb,var(--teal) 34%,transparent)}
.chip.c[aria-pressed="true"]{background:linear-gradient(135deg,var(--coral),color-mix(in srgb,var(--coral) 62%,#4a1a0b));color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--coral) 34%,transparent)}

/* numbered steps */
.steps{gap:8px}
.steps li{grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:11px 14px 11px 11px;border-radius:18px;font-size:14px;line-height:1.4;
  background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
.steps li::before{width:30px;height:30px;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 55%,#0b3d4a));box-shadow:0 6px 14px color-mix(in srgb,var(--teal) 30%,transparent)}

/* bullet lists inside cards and prevention page */
main ul:not(.hw-steps){list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
main ul:not(.hw-steps) > li{position:relative;padding:11px 14px 11px 38px;border-radius:16px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);line-height:1.45}
main ul:not(.hw-steps) > li::before{content:"";position:absolute;left:15px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 22%,transparent)}
.card ul{display:grid;gap:8px}
.doc-article ul,.doc-article ol{padding-left:20px}
.doc-article ul > li{background:none!important;border:0!important;padding:0!important}
.doc-article ul > li::before{display:none}
.doc-article h3{color:var(--teal);border-bottom-color:color-mix(in srgb,var(--ink) 12%,transparent)}

/* mood picker */
.mood{gap:8px}
.mood button{border-radius:18px;padding:12px 2px 10px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);font-weight:600;gap:7px}
.mood i{width:28px;height:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.2)}
.mood button[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,var(--surface));transform:translateY(-2px);box-shadow:0 10px 22px color-mix(in srgb,var(--teal) 26%,transparent)}

/* platform tiles (Zona chill) */
.tile{position:relative;overflow:hidden;border-radius:20px;padding:14px;gap:3px;border:1px solid color-mix(in srgb,var(--c,var(--teal)) 34%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c,var(--teal)) 26%,var(--surface)),color-mix(in srgb,var(--c,var(--teal)) 6%,var(--surface)) 70%)}
.tile::after{content:"↗";position:absolute;top:11px;right:13px;font-size:14px;color:var(--c,var(--teal));opacity:.85}
.tiles .tile:nth-child(1){--c:#FF4D4D}.tiles .tile:nth-child(2){--c:#E50914}.tiles .tile:nth-child(3){--c:#E1306C}
.tiles .tile:nth-child(4){--c:#1DB954}.tiles .tile:nth-child(5){--c:#25D1CC}.tiles .tile:nth-child(6){--c:#E60023}
.tile b{font-size:16px;font-weight:700}

/* link rows and vaccination / contact cards */
.lnk{border-radius:18px;background:color-mix(in srgb,var(--surface) 82%,transparent);border-color:color-mix(in srgb,var(--ink) 10%,transparent)}
.pill{padding:5px 11px;font-weight:700}
.card .line b{font-weight:600}

/* lists inside cards: no double frame */
.card:has(> ul){background:none;border:0;padding:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.card ul{padding:0!important;margin:0!important}
/* module tiles: sentence case everywhere */
.mod b{text-transform:none;letter-spacing:0;font-size:15px;font-weight:700}

/* ================= Tratamiento / Calendario ================= */
.tr-hero{padding:14px 16px 12px;margin-bottom:14px}
.tr-hero-body{display:flex;align-items:center;gap:6px;margin-top:2px}
.tr-orb{flex:none;width:150px;height:150px;display:grid;place-items:center}
.tr-orb .orb{width:150px;height:150px}
.tr-hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tr-hero-txt b{font-family:var(--heading);font-size:19px;font-weight:600;color:#F2FBFA}
.tr-hero-txt .ok{color:#8BE0B0;font-weight:700;font-size:15px}
.tr-hero-txt .warn{color:#F2946A;font-weight:700;font-size:15px}
.tr-hero-txt small{color:#9FB8B3;font-size:12.5px;line-height:1.35}
.tr-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;color:var(--teal);background:color-mix(in srgb,var(--teal) 18%,var(--surface))}
.tr-ic svg{width:21px;height:21px}
.treat{padding:14px 16px;border-radius:22px}
.treat h3{font-size:16px;font-weight:600}
.dot{width:44px;height:44px}
.heat .cell{border-radius:50%;aspect-ratio:1;width:100%;max-width:30px;justify-self:center}
.badge{border-radius:18px}
.ibtn{width:44px;height:44px;border-radius:14px}
.cal{padding:10px 8px 12px;border-radius:26px;gap:3px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid color-mix(in srgb,var(--ink) 9%,transparent)}
.cal button{border-radius:50%;font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--orange,var(--coral));color:var(--ink)}
.cal button[aria-pressed="true"]{background:linear-gradient(135deg,var(--teal),color-mix(in srgb,var(--teal) 55%,#0b3d4a));color:var(--teal-ink,#fff);box-shadow:0 8px 18px color-mix(in srgb,var(--teal) 35%,transparent)}
.legend{gap:12px}
/* ================= Features UI ================= */
.med-notice{margin:16px 2px 6px;font-size:12px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.lg .med-notice{color:#8FA9AD;border-top-color:#1c2c29;margin:6px 16px 20px}

/* profile page */
.pf-head{display:flex;align-items:center;gap:14px;margin:2px 0 6px}
.pf-id{flex:1;min-width:0}
.pf-switch{flex:none}
.pf-card{display:grid;gap:12px}
.pf-line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);min-height:36px}
.seg button.on{background:var(--teal);color:var(--teal-ink,#fff);box-shadow:0 6px 14px color-mix(in srgb,var(--teal) 35%,transparent)}
.pf-perm{display:grid;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.pf-ok{font-weight:700;color:var(--good);font-size:13px}
.pf-note{color:var(--muted);font-size:11.5px;line-height:1.4}
.pf-report{border-color:color-mix(in srgb,var(--teal) 30%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 16%,var(--surface)),var(--surface))}

/* trends */
.tr-chart{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.tr-grid{stroke:#1f2f2c;stroke-width:1;stroke-dasharray:3 4}
.tr-ax{font-size:10px;fill:#7C958F;font-family:var(--body)}
.tr-line{fill:none;stroke:#73C2C9;stroke-width:2.4;stroke-linecap:round}
.tr-pt{fill:#0f1918;stroke:#73C2C9;stroke-width:1.8}
.tr-last{fill:#F6A04B;stroke:#fff;stroke-width:1.6}
.tr-lbl{font-size:12px;font-weight:700;fill:#F2FBFA}
.tr-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;border:1px solid #1c2c29;border-radius:14px}
.tr-stats>div{padding:10px 4px;text-align:center;border-left:1px solid #1c2c29}
.tr-stats>div:first-child{border-left:0}
.tr-stats b{display:block;font-family:var(--heading);font-size:16px;font-weight:500}
.tr-stats span{font-size:10.5px;color:#9FB8B3}
.tr-empty{padding:30px 10px;text-align:center;color:#9FB8B3;font-size:14px}

/* family sheet */
.fp-list{display:grid;gap:8px;margin-bottom:6px}
.fp-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#0f1918;border:1px solid #1c2c29}
.fp-row.on{border-color:var(--teal)}
.fp-av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--teal) 24%,#0f1918);font-weight:800}
.fp-nm{flex:1;min-width:0}
.fp-nm b{display:block;font-size:14.5px}
.fp-nm small{color:#8FA9AD;font-size:12px}
.sheet.dark .field input,.sheet.dark .field select{background:#0f1918;color:#E2EFEB;border:1px solid #223532}

/* onboarding */
.onb{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg);color:var(--ink);overflow:hidden;animation:onbIn .5s cubic-bezier(.2,.8,.2,1) both}
.onb.out{animation:onbOut .35s ease forwards}
.onb .orb-blob{opacity:.28}
.onb .orb-blob.b1{left:-40px;top:8%}.onb .orb-blob.b2{right:-50px;top:40%}.onb .orb-blob.b3{left:30%;bottom:-30px;opacity:.2}
.onb>*:not(.orb-blob){position:relative;z-index:1}
.onb-top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.onb-dots{display:flex;gap:6px}
.onb-dots i{width:22px;height:5px;border-radius:99px;background:var(--line);transition:background .3s}
.onb-dots i.on{background:var(--teal)}
.onb-skip{background:none;border:0;color:var(--muted);font-weight:600;padding:8px}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;width:100%;margin:0 auto;overflow-y:auto}
.onb-body.fwd{animation:onbStepF .45s cubic-bezier(.2,.8,.2,1) both}
.onb-body.back{animation:onbStepB .45s cubic-bezier(.2,.8,.2,1) both}
.onb-body h2{font-family:var(--heading);font-size:30px;font-weight:300;letter-spacing:-.02em;margin:0}
.onb-sub{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
.onb-kin{align-items:flex-start;font-size:34px;line-height:1.15;margin:0}
.onb-actions{display:flex;gap:10px;max-width:420px;width:100%;margin:0 auto}
.onb-actions .sg-btn{flex:1}
.onb .field input,.onb .field select{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
@keyframes onbIn{from{opacity:0;transform:scale(1.04);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes onbOut{to{opacity:0;transform:scale(.96);filter:blur(10px)}}
@keyframes onbStepF{from{opacity:0;transform:translateX(28px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes onbStepB{from{opacity:0;transform:translateX(-28px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.onb,.onb-body{animation:none!important}}

.lg-link{display:block;width:100%;background:none;border:0;color:#73C2C9;font-weight:700;font-size:13.5px;padding:10px 0 4px;text-align:center}
.ct-emerg{display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:color-mix(in srgb,var(--coral) 45%,transparent)!important;background:linear-gradient(135deg,color-mix(in srgb,var(--coral) 18%,var(--surface)),var(--surface))}
.ct-emerg b{display:block;font-size:15px}
.ct-emerg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.ct-emerg .btn{flex:none;text-decoration:none}

.sg-btn{min-height:48px;border-radius:999px;border:1.5px solid transparent;background:var(--teal);color:var(--teal-ink,#fff)!important;font-size:15px;font-weight:800;padding:0 18px;display:flex;align-items:center;justify-content:center;width:100%;box-shadow:0 10px 24px color-mix(in srgb,var(--teal) 40%,transparent)}
.sg-btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)!important;box-shadow:none;font-weight:600}

/* ================= Arcade ================= */
.ar-best{position:absolute;top:13px;right:13px;font-size:11.5px;font-weight:700;color:var(--muted);padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.gm{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;background:#060d0c;color:#E2EFEB;animation:onbIn .4s cubic-bezier(.2,.8,.2,1) both;font-variant-numeric:tabular-nums}
.gm.out{animation:onbOut .3s ease forwards}
.gm-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid #15231f}
.gm-x{width:40px;height:40px;border-radius:50%;border:1px solid #223532;background:transparent;color:#E2EFEB;font-size:16px}
.gm-title{flex:1;font-family:var(--heading);font-size:18px;font-weight:600}
.gm-sc{font-size:13px;color:#9FB8B3}.gm-sc i{font-style:normal;font-family:var(--heading);font-size:20px;font-weight:500;color:#F2FBFA;margin-left:4px}
.gm-stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.gm-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gm-ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:22px;background:rgba(6,13,12,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gm-ov[hidden]{display:none}
.gm-card{width:100%;max-width:340px;text-align:center;padding:22px 20px;border-radius:26px;border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 22%,#0f1918),#0b1413);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.gm-card h2{font-family:var(--heading);font-size:24px;font-weight:600;margin:8px 0 6px}
.gm-card p{margin:0 0 10px;font-size:14px;line-height:1.5;color:#B7CDD0}
.gm-card small{display:block;margin-bottom:14px;color:#8FA9AD}
.gm-ic{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;color:var(--gc);background:color-mix(in srgb,var(--gc) 20%,#0b1413);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent)}
.gm-ic svg{width:26px;height:26px}
.gm-big{font-family:var(--heading);font-size:64px;font-weight:300;line-height:1;margin:4px 0 6px}
.gm-pts{font-weight:800;color:#8BE0B0!important}

/* memory */
.mm-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 14px 16px}
.mm-hud{display:flex;justify-content:space-between;font-size:13px;color:#9FB8B3;margin-bottom:10px}.mm-hud b{color:#F2FBFA}
.mm-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:center}
.mm-card{aspect-ratio:3/4;border:0;background:none;padding:0;perspective:600px}
.mm-in{display:block;position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.mm-card.on .mm-in{transform:rotateY(180deg)}
.mm-f{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mm-back{background:linear-gradient(145deg,#1b3a37,#0f1f1e);border:1px solid #2a4440;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.mm-back::after{content:"";width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#73C2C9 0 30%,transparent 32%),conic-gradient(from 0deg,#73C2C9 0 8%,transparent 8% 25%,#73C2C9 25% 33%,transparent 33% 50%,#73C2C9 50% 58%,transparent 58% 75%,#73C2C9 75% 83%,transparent 83%);opacity:.7}
.mm-front{transform:rotateY(180deg);background:linear-gradient(145deg,#12302d,#0b1a19);border:1px solid #73C2C9;color:#9CE5EC}
.mm-front svg{width:34px;height:34px}
.mm-card.ok .mm-front{border-color:#8BE0B0;color:#8BE0B0;box-shadow:0 0 18px rgba(139,224,176,.35)}
.mm-fact{min-height:44px;margin:10px 0 0;text-align:center;font-size:14px;color:#B7CDD0}

/* breathing */
.br-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:6px 18px 22px}
.br-lungs{flex:1;width:100%;min-height:0;position:relative}
.br-gauge{position:absolute;right:20px;top:24px;bottom:210px;width:12px;border-radius:99px;background:#15231f;border:1px solid #223532}

/* classify */
.cl-wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 18px 20px}

.cl-opt.bad{background:color-mix(in srgb,#EF7B5B 28%,#0f1918);border-color:#EF7B5B}

/* simon */
.sm-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px}
.sm-msg{font-family:var(--heading);font-size:22px;font-weight:500;min-height:30px}
.sm-round{color:#9FB8B3;font-size:14px}
.sm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.sm-pad{aspect-ratio:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);background:color-mix(in srgb,var(--pc) 14%,#0b1413);color:var(--pc);transition:transform .12s,background .12s,box-shadow .12s}
.sm-pad svg{width:34px;height:34px}.sm-pad small{font-size:12px;font-weight:700;color:#E2EFEB}
.sm-pad.lit{background:var(--pc);color:#06121c;transform:scale(1.04);box-shadow:0 0 36px var(--pc)}
.sm-pad.lit small{color:#06121c}

/* featured Arcade card */

/* ================= Arcade v2 + Zona chill ================= */
.gm-tb{width:40px;height:40px;border-radius:50%;border:1px solid #223532;background:transparent;color:#E2EFEB;display:grid;place-items:center;padding:0}
.gm-tb[hidden]{display:none}

.gm-diff{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}

.gm-diff button.on{background:var(--gc);border-color:var(--gc);color:#10181a}
html[data-theme="light"] .gm-diff button{border-color:var(--line);color:var(--muted)}

.gm-chal{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,#F6A04B 18%,transparent);border:1px solid color-mix(in srgb,#F6A04B 45%,transparent);font-size:13px;font-weight:700;color:#F6A04B}
html[data-theme="light"] .gm-chal{color:#9a5a10}
.chal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 12px;padding:12px 14px;border-radius:20px;border:1px solid color-mix(in srgb,#F6A04B 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#F6A04B 16%,var(--surface)),var(--surface));color:var(--ink)}
.chal b{display:block;font-size:14.5px}
.chal small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.chal-tag{flex:none;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:#F6A04B;color:#241503}
.chal.done .chal-tag{background:#8BD16A}

/* sound mixer */
.snd{border-radius:24px;padding:14px;border:1px solid color-mix(in srgb,#6AA7F2 35%,transparent);background:linear-gradient(150deg,color-mix(in srgb,#6AA7F2 14%,var(--surface)),var(--surface))}
.snd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snd-b{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink);font-size:12.5px;font-weight:700;transition:transform .15s}
.snd-b:active{transform:scale(.95)}
.snd-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#6AA7F2 16%,var(--surface));color:#6AA7F2}
.snd-ic svg{width:20px;height:20px}
.snd-b.on{border-color:#6AA7F2;background:color-mix(in srgb,#6AA7F2 20%,var(--surface));box-shadow:0 8px 20px color-mix(in srgb,#6AA7F2 30%,transparent)}
.snd-b.on .snd-ic{background:#6AA7F2;color:#fff}
.snd-ctl{display:grid;gap:10px;margin-top:12px}
.snd-vol{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;color:var(--muted)}
.snd-vol input{flex:1;accent-color:#6AA7F2}
.snd-timer{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.snd-timer button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;min-height:36px}
.snd-timer button.on{background:#6AA7F2;border-color:#6AA7F2;color:#fff}
.snd-st{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);min-height:28px}
.snd-stop{border:0;background:none;color:var(--coral);font-weight:800;font-size:13px;padding:6px}

/* chill cards */
.ch-arc,.ch-read{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:22px;color:var(--ink)}
.ch-arc{border:1px solid color-mix(in srgb,#C792EA 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#C792EA 18%,var(--surface)),var(--surface))}
.ch-arc-ic{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#C792EA;background:color-mix(in srgb,#C792EA 20%,var(--surface));border:1px solid color-mix(in srgb,#C792EA 40%,transparent)}
.ch-arc-ic svg{width:24px;height:24px}
.ch-arc-tx{flex:1;min-width:0}
.ch-arc-tx b{display:block;font-size:16px;font-family:var(--heading);font-weight:600}
.ch-arc-tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.ch-arc-tx em{display:block;font-style:normal;font-size:12px;font-weight:700;color:#F6A04B;margin-top:4px}
html[data-theme="light"] .ch-arc-tx em{color:#9a5a10}
.ch-arc-go{flex:none;padding:9px 18px;border-radius:999px;background:#C792EA;color:#241230;font-weight:800;font-size:13.5px}
.ch-read{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.ch-read-tx{flex:1;min-width:0}
.ch-read-tx b{display:block;font-size:15px}
.ch-read-tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}

.mm-dense .mm-card{aspect-ratio:1/1.12}
.mm-dense{gap:8px}

/* achievements */
button.badge{background:transparent;font:inherit;color:var(--muted);cursor:pointer;width:100%}
button.badge.on{color:var(--ink)}
button.badge:active{transform:scale(.96)}
.bd-sheet{text-align:center;padding:4px 4px 6px}
.bd-ic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:18px;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);filter:grayscale(.7);opacity:.8}
.bd-ic.on{filter:none;opacity:1;background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.bd-ic svg{width:28px;height:28px}
.bd-sheet h2{margin:8px 0 4px}
.bd-st{font-weight:700;color:var(--muted);margin:8px 0 14px}
.bd-st.ok{color:var(--good)}
/* ================= Buscagérmenes + Sopa de letras ================= */
.sw-wrap,.ws-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px 12px 16px;overflow-y:auto}
.sw-hud,.ws-hud{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#9FB8B3;margin-bottom:10px}
.sw-hud b,.ws-hud b{color:#F2FBFA;font-family:var(--heading);font-weight:500;font-size:16px}
html[data-theme="light"] .sw-hud,html[data-theme="light"] .ws-hud{color:var(--muted)}
html[data-theme="light"] .sw-hud b,html[data-theme="light"] .ws-hud b{color:var(--ink)}
.sw-grid,.ws-grid{display:grid;gap:3px;justify-content:center;margin:auto 0}
.sw-c{border-radius:9px;border:1px solid #2a4440;background:linear-gradient(145deg,#1b3a37,#0f1f1e);color:#E2EFEB;font-family:var(--heading);font-weight:700;display:grid;place-items:center;padding:0;touch-action:manipulation}
.sw-c:active{transform:scale(.94)}
.sw-c.rv{background:#0c1716;border-color:#16312e}
.sw-c.fl{background:linear-gradient(145deg,#1f4a52,#112d33);border-color:#73C2C9}
.sw-c.boom{background:#4a1f16;border-color:#EF7B5B}
.sw-c.n1{color:#73C2C9}.sw-c.n2{color:#8BD16A}.sw-c.n3{color:#F6A04B}.sw-c.n4{color:#C792EA}.sw-c.n5{color:#EF7B5B}.sw-c.n6{color:#7FD3A6}.sw-c.n7{color:#E5C04A}.sw-c.n8{color:#fff}
html[data-theme="light"] .sw-c{background:linear-gradient(145deg,#d3ecee,#bfe0e3);border-color:#a9d3d7;color:var(--ink)}
html[data-theme="light"] .sw-c.rv{background:#fff;border-color:#e0ecee}
html[data-theme="light"] .sw-c.fl{background:linear-gradient(145deg,#c4e7ec,#a6d6dd);border-color:#0b8a7e}
html[data-theme="light"] .sw-c.boom{background:#fde0d8;border-color:#EF7B5B}
html[data-theme="light"] .sw-c.n1{color:#0b8a7e}html[data-theme="light"] .sw-c.n3{color:#b36a12}
.sw-bar{display:flex;gap:8px;margin-top:12px}
.sw-mode{border:1px solid #2a4440;background:transparent;color:#B7CDD0;border-radius:999px;padding:10px 22px;font-weight:700;font-size:14px;min-height:44px}
.sw-mode.on{background:var(--gc);border-color:var(--gc);color:#10181a}
html[data-theme="light"] .sw-mode{border-color:var(--line);color:var(--muted)}
.sw-hint{margin:8px 0 0;font-size:12px;color:#7C958F;text-align:center}
.ws-hintb{border:1px solid #2a4440;background:transparent;color:#E2EFEB;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;min-height:36px}
html[data-theme="light"] .ws-hintb{border-color:var(--line);color:var(--ink)}
.ws-c{border-radius:8px;border:1px solid #213733;background:#0f1918;color:#E2EFEB;font-family:var(--heading);font-weight:600;padding:0;display:grid;place-items:center;touch-action:manipulation}
.ws-c.sel{background:#73C2C9;color:#10181a;border-color:#73C2C9}
.ws-c.fd{border-color:transparent}
.ws-c.hint{animation:wsHint .6s ease 3;outline:2px solid #F6A04B}
@keyframes wsHint{50%{transform:scale(1.18)}}
html[data-theme="light"] .ws-c{background:#fff;border-color:#d6e6e7;color:var(--ink)}
html[data-theme="light"] .ws-c.sel{background:#0b8a7e;color:#fff}
.ws-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;max-width:420px}
.ws-w{font-size:12px;font-weight:800;letter-spacing:.04em;padding:5px 10px;border-radius:999px;border:1px solid #2a4440;color:#B7CDD0}
.ws-w.on{background:var(--wc);border-color:var(--wc);color:#10181a;text-decoration:line-through}
html[data-theme="light"] .ws-w{border-color:var(--line);color:var(--muted)}

/* ================= Nebulizer hygiene page ================= */
.hg-rule{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;margin:0 0 12px;border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 16%,var(--surface)),var(--surface))}
.hg-rule b{color:var(--teal);font-size:15px}
.hg-rule p{font-size:12.5px;margin:3px 0 0;line-height:1.45;color:var(--ink)}
.hg-prog{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);margin-bottom:4px}
.hg-prog svg circle{fill:none;stroke-width:6;stroke-linecap:round}
.hg-prog svg .bg{stroke:color-mix(in srgb,var(--teal) 18%,transparent)}
.hg-prog svg .fg{stroke:var(--teal);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.hg-prog.ok svg .fg{stroke:var(--good)}
.hg-prog-tx{flex:1;min-width:0}
.hg-prog-tx b{display:block;font-size:15px}
.hg-prog-tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hg-streak{flex:none;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold)}
.hg-steps{display:grid;gap:10px}
.hg-step{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.hg-step:active{transform:scale(.985)}
.hg-step.on{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.hg-chk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--teal);border:2px solid color-mix(in srgb,var(--teal) 55%,transparent);transition:all .2s}
.hg-step.on .hg-chk{background:var(--good);border-color:var(--good);color:#fff;animation:dotPop .45s cubic-bezier(.34,1.6,.64,1)}
.hg-tx{flex:1;min-width:0}
.hg-tx b{display:block;font-size:15px;line-height:1.3}
.hg-step.on .hg-tx b{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--good) 70%,transparent)}
.hg-tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.hg-timer{margin-top:8px;border:1px solid color-mix(in srgb,var(--teal) 50%,transparent);background:transparent;color:var(--teal);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:999px;min-height:36px}
.hg-mark{margin-top:16px;min-height:52px;font-size:15px}
.hg-mark.done{background:color-mix(in srgb,var(--good) 22%,var(--surface));color:var(--good);box-shadow:none;border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.hg-note{text-align:center;font-size:12.5px;color:var(--muted);margin:8px 8px 0}
.shake{animation:hgShake .5s}
@keyframes hgShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.gm-top{position:relative;z-index:10}

/* no smooth scrolling on the main column: restoring the scroll after a re-render animated from the top */

/* the fake phone status bar (clock, wifi, battery) is not needed in the standalone app: keep only the safe-area spacer */

/* ================= PIN pad ================= */
.pinpad{position:absolute;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--bg);color:var(--ink);overflow:hidden}

.pp-top{width:100%;display:flex;justify-content:flex-end;min-height:40px}
.pp-x{background:none;border:0;color:var(--muted);font-weight:700;padding:10px}
.pp-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.pp-mid h2{font-family:var(--heading);font-size:28px;font-weight:300;margin:0}
.pp-mid p{margin:0;color:var(--muted);font-size:15px}

.pet-stage{position:relative;overflow:hidden;border-radius:28px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px 12px 16px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 22%,var(--surface)) 0%,var(--surface) 100%);margin-bottom:12px}

.pet-pts{position:absolute;top:12px;right:12px;z-index:3;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--teal);font-weight:800;font-size:12px;border-radius:99px;padding:6px 12px}
