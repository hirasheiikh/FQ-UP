.pet-bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pet-hit{position:relative;z-index:2;background:none;border:0;padding:0;width:190px;height:190px;-webkit-tap-highlight-color:transparent}
.pet-svg{width:100%;height:100%;overflow:visible;animation:mBob 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,168,152,.35))}
.pet-shadow{width:110px;height:12px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(5px);margin-top:-6px}

.pet-hit.pet-hop .pet-svg{animation:petHop .6s cubic-bezier(.3,1.6,.5,1)}

@keyframes petHop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-30px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
@keyframes petEat{0%,100%{transform:scale(1)}25%{transform:scale(1.1,.9)}50%{transform:scale(.92,1.08)}75%{transform:scale(1.06,.95)}}
@keyframes petWash{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.pet-stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.8;animation:petTw 2.4s infinite}
.pet-stars i:nth-child(1){left:14%;top:18%}.pet-stars i:nth-child(2){left:78%;top:22%;animation-delay:.5s}.pet-stars i:nth-child(3){left:30%;top:40%;animation-delay:1s}.pet-stars i:nth-child(4){left:88%;top:48%;animation-delay:1.4s}.pet-stars i:nth-child(5){left:55%;top:12%;animation-delay:.8s}

<script>
/* Keeps --app-h equal to the real visible height. On the iPhone home-screen app the window can change size right
   after launch, so it is re-read on resize, rotation, return to the app and a few times just after loading. */
(function(){
  var root = document.documentElement;
  function fit(){
    try{
      var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var h = window.innerHeight;
      root.style.setProperty('--app-h', h + 'px');
    }catch(e){}
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 150); });
  window.addEventListener('pageshow', fit);
  document.addEventListener('visibilitychange', fit);
  [120, 500, 1500].forEach(function(t){ setTimeout(fit, t); });

  /* Ask the browser not to delete this app's data when it is short of space or the app is not used for a while */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
})();
</script>

window.scrollHero = function(idx){
  const c = document.querySelector('.hero-carousel');
  if(!c) return;
  const cards = c.querySelectorAll('.hero-card');
  if(cards[idx]){
    cards[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    updateHeroDots(idx);
    haptic(12);
  }
};

window.updateHeroDots = function(activeIdx){
  const dots = document.querySelectorAll('.hero-dots .hero-dot');
  dots.forEach((d, i) => {
    if(i === activeIdx) d.classList.add('active');
    else d.classList.remove('active');
  });
};

function initHeroDrag(){
  const c = document.querySelector('.hero-carousel');
  if(!c || c._dragInit) return;
  c._dragInit = true;
  let isDown = false, hasDragged = false, startX = 0, scrollLeft = 0;

  // Mouse wheel horizontal scroll on PC
  c.addEventListener('wheel', e => {
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      e.preventDefault();
      c.scrollLeft += e.deltaY * 0.85;
    }
  }, {passive:false});

  // Mouse drag with strict button pass-through
  c.addEventListener('mousedown', e => {
    // If user clicked directly on a button or link, let it click freely!
    if(e.target.closest('button, [data-go], [data-act], a, input')) return;
    isDown = true;
    hasDragged = false;
    startX = e.pageX - c.offsetLeft;
    scrollLeft = c.scrollLeft;
  });

  window.addEventListener('mouseup', () => {
    if(!isDown) return;
    isDown = false;
    c.classList.remove('grabbing');
  });

  c.addEventListener('mousemove', e => {
    if(!isDown) return;
    const x = e.pageX - c.offsetLeft;
    const diff = Math.abs(x - startX);
    if(diff > 5){
      hasDragged = true;
      e.preventDefault();
      c.classList.add('grabbing');
      c.scrollLeft = scrollLeft - (x - startX) * 1.25;
    }
  });

  c.addEventListener('scroll', () => {
    const card = c.querySelector('.hero-card');
    const w = card ? (card.offsetWidth + 10) : 280;
    const idx = Math.round(c.scrollLeft / w);
    window.updateHeroDots(Math.min(2, Math.max(0, idx)));
  }, {passive:true});
}



/* Gamification Levels System (FQ-UP Pro) */
const LEVELS = [
  { level: 1, min: 0,    max: 100,  title: 'Iniciado FQ',           desc: 'Primeros hábitos de autocuidado y compromiso', icon: '🌱' },
  { level: 2, min: 100,  max: 300,  title: 'Defensor Pulmonar',     desc: 'Compromiso diario con tus nebulizaciones',    icon: '' },
  { level: 3, min: 300,  max: 600,  title: 'Guardián Bronquial',    desc: 'Rutina consolidada de fisioterapia',        icon: '' },
  { level: 4, min: 600,  max: 1000, title: 'Maestro del Aerosol',   desc: 'Excelente técnica respiratoria y constancia', icon: '' },
  { level: 5, min: 1000, max: 1500, title: 'Campeón de Adherencia', desc: 'Racha impecable y control clínico integral', icon: '' },
  { level: 6, min: 1500, max: 2200, title: 'Héroe Respiratorio',    desc: 'Dominio absoluto de la rutina de autocura',   icon: '⭐' },
  { level: 7, min: 2200, max: 3000, title: 'Leyenda FQ',            desc: 'Máximo nivel de superación, salud y ejemplo', icon: '' }
];

function getLevelInfo(pts = 0){
  const p = Math.max(0, pts || 0);
  let cur = LEVELS[0];
  for(let i = 0; i < LEVELS.length; i++){
    if(p >= LEVELS[i].min) cur = LEVELS[i];
  }
  const next = LEVELS.find(l => l.level === cur.level + 1);
  const minPts = cur.min;
  const maxPts = next ? next.min : (cur.min + 1000);
  const range = maxPts - minPts;
  const inLevel = Math.max(0, p - minPts);
  const pct = next ? Math.min(100, Math.max(0, Math.round((inLevel / range) * 100))) : 100;
  
  return {
    level: cur.level,
    title: cur.title,
    desc: cur.desc,
    icon: cur.icon,
    minPts,
    maxPts,
    pct,
    nextLevel: next ? next.level : cur.level,
    nextTitle: next ? next.title : 'Nivel Máximo',
    isMax: !next
  };
}
window.LEVELS = LEVELS;
window.getLevelInfo = getLevelInfo;

function addPoints(pts, desc, type='med'){
  const prevLevel = (S.level || (getLevelInfo(S.points).level));
  S.points = Math.max(0, (S.points || 0) + pts);
  const info = getLevelInfo(S.points);
  S.level = info.level;
  if(!S.pointsHistory) S.pointsHistory = [];
  const now = new Date();
  const timeStr = `Hoy, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  S.pointsHistory.unshift({ id: Date.now(), desc, pts, type, time: timeStr });
  if(S.pointsHistory.length > 50) S.pointsHistory.pop();
  save();
  if(info.level > prevLevel){
    playChime('success');
    fireConfetti();
    toast(`¡Has subido al Nivel ${info.level}: ${info.title}!`);
  }
}


// Cough log lives in a bottom sheet: render it, and refresh it in place (no re-animation)
window.openSputumSheet = function(){
  haptic(10);
  openSheet(PAGES.sputum[1]());
  const s = document.querySelector('#sheet .sheet');
  if(s){ s.dataset.kind = 'sputum'; s.classList.add('dark'); }
};
function refreshSputumSheet(){
  const s = document.querySelector('#sheet .sheet[data-kind="sputum"]');
  if(!s) return false;
  const top = s.scrollTop;
  [...s.children].forEach(el => { if(!el.classList.contains('sheet-grabber') && !el.classList.contains('close')) el.remove(); });
  s.insertAdjacentHTML('beforeend', PAGES.sputum[1]());
  s.scrollTop = top;
  return true;
}

// Two-tap delete: first tap arms the button ("¿Borrar?"), second tap within 3s deletes
window.askDeleteSputum = function(id, btn){
  if(btn.dataset.armed){
    const entry = (S.sputumLog || []).find(x => x.id === id);
    let refunded = 0;
    // Take back the Gotas FQ this entry earned (only entries created with a linked points record)
    if(entry && entry.ptsId && S.pointsHistory){
      const pi = S.pointsHistory.findIndex(x => x.id === entry.ptsId);
      if(pi !== -1){
        refunded = S.pointsHistory[pi].pts || 0;
        S.pointsHistory.splice(pi, 1);
        S.points = Math.max(0, (S.points || 0) - refunded);
        S.level = getLevelInfo(S.points).level;
      }
    }
    S.sputumLog = (S.sputumLog || []).filter(x => x.id !== id);
    S.lastSputum = (S.sputumLog[0] && S.sputumLog[0].scale) || null;
    save(); haptic(20); toast(refunded ? `Entrada borrada (−${refunded} Gotas FQ)` : 'Entrada borrada');
    if(!refreshSputumSheet()) rerender();
    return;
  }
  haptic(10);
  btn.dataset.armed = '1';
  btn.textContent = '¿Borrar?';
  btn.style.background = 'var(--coral)';
  btn.style.color = '#fff';
  setTimeout(() => {
    if(!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.textContent = '×';
    btn.style.background = '';
    btn.style.color = '';
  }, 3000);
};

window.recordSputum = function(code, title, desc){
  if(!S.sputumLog) S.sputumLog = [];
  const now = new Date();
  const timeStr = `Hoy, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const cough = S.lastCough || 'Tos habitual';
  S.lastSputum = code;
  S.sputumLog.unshift({ id: Date.now(), scale: code, desc: title, cough: cough, time: timeStr, status: desc });
  if(S.sputumLog.length > 30) S.sputumLog.pop();
  addPoints(10, `Registro de esputo (${code} · ${title})`, 'med');
  if(S.pointsHistory && S.pointsHistory[0]) S.sputumLog[0].ptsId = S.pointsHistory[0].id;
  save();
  playChime('success');
  toast(`✔ Guardado en tu historial: ${code}`);
  if(!refreshSputumSheet()) rerender();
};

window.recordCough = function(coughName){
  S.lastCough = coughName;
  if(S.sputumLog && S.sputumLog[0]){
    S.sputumLog[0].cough = coughName;
  }
  toast(`Tos registrada: ${coughName}`);

window.deletePointEntry = function(id){
  if(!S.pointsHistory) return;
  const idx = S.pointsHistory.findIndex(x => x.id === id);
  if(idx === -1) return;
  const item = S.pointsHistory[idx];
  const pts = item.pts || 0;

  // Subtract points safely
  S.points = Math.max(0, S.points - pts);
  S.level = getLevelInfo(S.points).level;
  // Remove from history
  S.pointsHistory.splice(idx, 1);

  // If it was a medication or treatment taken today, un-tick it
  if(item.type === 'med' && S.log && S.log[TK]){
    for(const t of TREAT){
      if(item.desc.toLowerCase().includes(t.name.toLowerCase()) || item.desc.toLowerCase().includes(t.short.toLowerCase())){
        if(S.log[TK][t.id] > 0) S.log[TK][t.id]--;
        break;
      }
    }
  }

  save();
  playChime('tick');
  haptic([30, 40]);
  toast(`× Eliminado: -${pts} Gotas FQ`);
  rerender();
};

/* Haptic Feedback Utility */
function haptic(ms=15){
  try { if(localStorage.getItem('fqup_haptic') === '0') return;
    if(window.navigator && window.navigator.vibrate) window.navigator.vibrate(ms);
  } catch(e){}
}

/* Micro-Confetti burst for 100% adherence */
function fireConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  
  const particles = Array.from({length: 45}, () => ({
    x: canvas.width / 2,
    y: canvas.height * 0.35,
    vx: (Math.random() - 0.5) * 8,
    vy: -Math.random() * 8 - 3,
    color: ['#00A898', '#E26237', '#DA931E', '#268752', '#5D8380'][Math.floor(Math.random()*5)],
    size: Math.random() * 6 + 4,
    rot: Math.random() * 360,
    rotV: (Math.random() - 0.5) * 12,
    alpha: 1
  }));

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25; // gravity
      p.rot += p.rotV;
      p.alpha -= 0.015;
      if(p.alpha > 0){
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
    });
    if(alive) requestAnimationFrame(loop);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(loop);
}

// Hook haptic into playChime and go()
const _oldPlayChime = playChime;
playChime = function(type){
  _oldPlayChime(type);
  if(type==='success') haptic([25, 40, 25]);
  else if(type==='tick') haptic(12);
  else if(type==='alert') haptic([40, 60, 40]);
};

// Mode toggle for Presentation vs Fullscreen

// Edge Swipe Back & Gestures
let touchStartX = 0, touchStartY = 0;
const appEl = document.getElementById('app');
if(appEl){
  appEl.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;

    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if(touchStartX <= 40 && dx > 70 && dy < 40 && R.page){

    }

}

function createSpark(targetEl){
  const rect = targetEl.getBoundingClientRect();
  const container = document.getElementById('app');
  if(!container) return;
  const appRect = container.getBoundingClientRect();
  const cx = rect.left - appRect.left + rect.width / 2;
  const cy = rect.top - appRect.top + rect.height / 2;

  for(let i = 0; i < 8; i++){
    const spark = document.createElement('div');
    spark.className = 'spark-dot';
    const angle = (i / 8) * Math.PI * 2;
    const dist = Math.random() * 26 + 18;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist;
    spark.style.setProperty('--tx', `${tx}px`);
    spark.style.setProperty('--ty', `${ty}px`);
    spark.style.left = `${cx}px`;
    spark.style.top = `${cy}px`;
    container.appendChild(spark);
    setTimeout(() => spark.remove(), 320);
  }
}

/* Sound Synthesizer via Web Audio API */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playChime(type='success'){
  try{ if(localStorage.getItem('fqup_sound') === '0') return;
    if(!audioCtx) audioCtx = new AudioCtx();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if(type==='success'){
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if(type==='tick'){
      osc.frequency.setValueAtTime(440, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if(type==='breathe'){
      osc.frequency.setValueAtTime(329.63, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    } else if(type==='game-point'){
      osc.frequency.setValueAtTime(587.33, now); // D5
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if(type==='game-over'){
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  }catch(e){}
}

function weekStats(){
  const days = [...Array(7)].map((_,i)=>addDays(TODAY,i-6)), out={days};
  let tot=0, tg=0;
  TREAT.forEach(t=>{
    const done = days.reduce((a,d)=>a+Math.min((S.log[key(d)]||{})[t.id]||0, perDay(t.id)),0);
    const target = t.id==='ej'?S.goals.ej:S.goals[t.id]*7;
    const dn = Math.min(done,target);
    out[t.id] = {done:dn, target, pct:target?Math.round(dn/target*100):100};
    tot += dn; tg += target;
  });
  out.all = tg?Math.round(tot/tg*100):0;
  return out;
}
function dayComplete(k){ const L=S.log[k]; if(!L) return false; return TREAT.filter(t=>t.id!=='ej').every(t=>L[t.id]>=perDay(t.id)); }
function streak(){ let n=0; for(let i=1;i<60;i++){ if(dayComplete(key(addDays(TODAY,-i)))) n++; else break; } if(dayComplete(TK)) n++; return n; }

function ring(p){
  const r=28, c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 70 70" role="img" aria-label="${p}%"><circle cx="35" cy="35" r="${r}" fill="none" stroke="var(--line)" stroke-width="7.5"/><circle cx="35" cy="35" r="${r}" fill="none" stroke="var(--teal)" stroke-width="7.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(p,100)/100)}" transform="rotate(-90 35 35)"/><text x="35" y="41" text-anchor="middle" font-size="16">${p}%</text></svg>`;
}

function getBiomarkerStats(){
  if(!(S.biomarkerLogs && S.biomarkerLogs.length) && !(S.biomarkers && S.biomarkers.fev1)){
    return { latest:{}, fev1:{cur:null,min:'—',max:'—',avg:'—',state:'—',badgeBg:'',color:''}, sat:{cur:null,min:'—',max:'—',state:'—'}, weight:{cur:null,diff:''}, freshness:'Sin mediciones', stale:false, weightSpan:'' };
  }
  const logs = (S.biomarkerLogs && S.biomarkerLogs.length) ? S.biomarkerLogs : [
    { date: '2026-11-05', time: '18:30', fev1: (S.biomarkers&&S.biomarkers.fev1)||84, sat: (S.biomarkers&&S.biomarkers.sat)||98, weight: (S.biomarkers&&S.biomarkers.weight)||52.4 }
  ];
  const latest = logs[0];
  const fev1List = logs.map(x => x.fev1).filter(Boolean);
  const satList = logs.map(x => x.sat).filter(Boolean);
  const weightList = logs.map(x => x.weight).filter(Boolean);

  const fev1Min = Math.min(...fev1List), fev1Max = Math.max(...fev1List);
  const fev1Avg = (fev1List.reduce((a,b)=>a+b,0) / fev1List.length).toFixed(1);
  const fev1Diff = latest.fev1 - fev1Avg;
  const fev1State = Math.abs(fev1Diff) <= 1.5 ? 'Estable' : (fev1Diff > 1.5 ? 'Favorable' : 'Descenso');
  const fev1BadgeBg = fev1State === 'Descenso' ? 'var(--coral-soft)' : (fev1State === 'Favorable' ? 'var(--good-soft)' : 'var(--teal-soft)');
  const fev1Color = fev1State === 'Descenso' ? 'var(--coral)' : (fev1State === 'Favorable' ? 'var(--good)' : 'var(--teal)');

  const satMin = Math.min(...satList), satMax = Math.max(...satList);
  const satState = latest.sat >= 95 ? 'Normal' : 'Baja';

  const weightOldest = weightList[weightList.length - 1];
  const weightDiff = (latest.weight - weightOldest).toFixed(1);
  const weightDiffStr = (weightDiff >= 0 ? `+${weightDiff}` : `${weightDiff}`) + ' kg';

  return {
    latest,
    fev1: { cur: latest.fev1, min: fev1Min, max: fev1Max, avg: fev1Avg, state: fev1State, badgeBg: fev1BadgeBg, color: fev1Color },
    sat: { cur: latest.sat, min: satMin, max: satMax, state: satState },
    weight: { cur: latest.weight, diff: weightDiffStr },
    freshness: (() => {
      const days = Math.round((new Date(TK+'T00:00:00') - new Date(latest.date+'T00:00:00')) / 86400000);
      const when = days<=0 ? 'Hoy' : days===1 ? 'Ayer' : `Hace ${days} días`;
      return `${when} · ${latest.time || ''}`.trim().replace(/·$/,'').trim();
    })(),
    stale: (() => (new Date(TK+'T00:00:00') - new Date(latest.date+'T00:00:00')) / 86400000 > 7)(),
    weightSpan: (() => { const o = logs[logs.length-1]; const dd = Math.round((new Date(latest.date+'T00:00:00') - new Date(o.date+'T00:00:00'))/86400000); return dd>0 ? `en ${dd} días` : 'primera lectura'; })()
  };
}
window.getBiomarkerStats = getBiomarkerStats;

function sparkSVG(series, color){
  if(!series || series.length < 2) return '';
  const W = 100, H = 26, pad = 3;
  const lo = Math.min(...series), hi = Math.max(...series), span = (hi - lo) || 1;
  const pts = series.map((v, i) => [pad + i * (W - 2*pad) / (series.length - 1), H - pad - (v - lo) / span * (H - 2*pad)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  return `<svg class="pro-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function weekAgenda(byDay){
  const d0 = new Date(cal.sel + 'T00:00'), start = addDays(d0, -((d0.getDay() + 6) % 7));
  const DN = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  return `<div class="wk-nav"><button class="ibtn" data-act="wk" data-d="-7" aria-label="Semana anterior">${I.back}</button><b>${fmt(key(start))} – ${fmt(key(addDays(start, 6)))}</b><button class="ibtn" data-act="wk" data-d="7" aria-label="Semana siguiente" style="transform:scaleX(-1)">${I.back}</button></div>
  <div class="wk-list">${[...Array(7)].map((_, i) => { const d = addDays(start, i), k = key(d), ev = (byDay[k] || []).slice().sort((a, b) => a.time.localeCompare(b.time));
    return `<button type="button" class="wk-day${k === TK ? ' today' : ''}${k === cal.sel ? ' sel' : ''}" data-act="selday" data-k="${k}"><span class="wk-d"><small>${DN[i]}</small><b>${d.getDate()}</b></span>
      <span class="wk-ev">${ev.length ? ev.map(e => `<em style="--c:${EVT[e.type][1]}"><i></i>${e.time && e.time !== '—' ? e.time + ' · ' : ''}${esc(e.title)}</em>`).join('') : '<small>Sin eventos</small>'}</span></button>`; }).join('')}</div>`;
}function vCalendario(){
  const m = cal.m, y = m.getFullYear(), mo = m.getMonth();
  const start = addDays(m, -((m.getDay()+6)%7));

    return `<button class="${d.getMonth()!==mo?'out':''} ${k===TK?'today':''}" data-act="selday" data-k="${k}" aria-pressed="${k===cal.sel}" aria-label="${d.getDate()} ${MONL[d.getMonth()]}${ev.length?', '+ev.length+' eventos':''}">
      ${d.getDate()}

const getAccent = () => { try { return localStorage.getItem('fqup_accent') || ''; } catch(e){ return ''; } };
const getFs = () => { try { return localStorage.getItem('fqup_fs') || '1'; } catch(e){ return '1'; } };
function applyLook(){
  const root = document.documentElement, ac = ACCENTS.find(a => a[0] === getAccent());
  if(ac && ac[1]){ root.style.setProperty('--teal', ac[1]); root.style.setProperty('--teal-deep', ac[1]); } else { root.style.removeProperty('--teal'); root.style.removeProperty('--teal-deep'); }
  root.setAttribute('data-fs', getFs());
}
window.setAccentPref = function(v){ try { localStorage.setItem('fqup_accent', v); } catch(e){} applyLook(); haptic(8); rerender(); };
window.setFsPref = function(v){ try { localStorage.setItem('fqup_fs', v); } catch(e){} applyLook(); haptic(8); rerender(); };
applyLook();
const prefOn = k => { try { return localStorage.getItem(k) === '0' ? '0' : '1'; } catch(e){ return '1'; } };
window.setSoundPref = function(v){ try { localStorage.setItem('fqup_sound', v); } catch(e){} if(v === '1') playChime('tick'); rerender(); };
window.setHapticPref = function(v){ try { localStorage.setItem('fqup_haptic', v); } catch(e){} haptic(20); rerender(); };
window.runSelfTest = function(){
  const res = []; let bad = 0;
  Object.keys(PAGES).forEach(k => { try { const h = String(PAGES[k][1]()); if(h.length < 20) throw new Error('vacía'); res.push([k, true]); } catch(e){ bad++; res.push([k, false, String(e.message || e).slice(0, 60)]); } });
  const checks = [['Almacenamiento local', (() => { try { localStorage.setItem('fqup_t', '1'); localStorage.removeItem('fqup_t'); return true; } catch(e){ return false; } })()], ['Audio', !!(window.AudioContext || window.webkitAudioContext)], ['Notificaciones', 'Notification' in window], ['Instalable (service worker)', 'serviceWorker' in navigator]];
  openSheet(`<h2>${cT('Diagnóstico de la app', 'Diagnòstic de l\'app')}</h2>
    <p class="sub">${bad ? cT(bad + ' pantalla(s) con problemas.', bad + ' pantalla(es) amb problemes.') : cT('Las ' + res.length + ' pantallas se generan correctamente.', 'Les ' + res.length + ' pantalles es generen correctament.')}</p>
    <div class="stack">${checks.map(([n, ok]) => `<div class="pf-line"><span>${n}</span><b style="color:var(--${ok ? 'good' : 'coral'})">${ok ? 'OK' : cT('No disponible', 'No disponible')}</b></div>`).join('')}
    ${res.filter(r => !r[1]).map(r => `<div class="pf-line"><span>${r[0]}</span><b style="color:var(--coral)">${esc(r[2])}</b></div>`).join('')}</div>`);
};

  LANG = v; localStorage.setItem('fqup_lang', LANG);

};

  'nebulizer-cleaning': ['Higiene del Nebulizador', () => `
    <h2 class="sec">Protocolo de Limpieza y Desinfección</h2>

    <!-- Golden Rules Badge -->
    <div class="card" style="background:var(--teal-soft);border:1.5px solid color-mix(in srgb,var(--teal) 35%,transparent);margin-bottom:14px">

        <span class="tr-ic">${I.prev}</span>
        <div>

          <p style="font-size:12px;margin:3px 0 0;line-height:1.4">Un nebulizador mal desinfectado puede transportar bacterias directamente a la vía aérea inferior. La higiene rigurosa es tan vital como la propia medicación.</p>
        </div>
      </div>
    </div>

    <div class="label">Checklist diario tras cada inhalación</div>
    <div class="stack" style="gap:10px">
      <div class="card" style="display:flex;gap:12px;align-items:flex-start">

        <div>
          <b>Desmontar y lavar con jabón neutro</b>
          <p style="font-size:12px;color:var(--muted);margin:2px 0 0">Separa la cazoleta, boquilla y membrana. Lávalo inmediatamente con agua templada y unas gotas de lavavajillas suave.</p>
        </div>
      </div>

      <div class="card" style="display:flex;gap:12px;align-items:flex-start">
        <span style="background:var(--teal);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0">2</span>
        <div>
          <b>Aclarar con agua destilada o hervida</b>
          <p style="font-size:12px;color:var(--muted);margin:2px 0 0">¡Nunca dejes secar restos de agua del grifo! El agua corriente contiene microorganismos ambientales no estériles.</p>

      </div>

      <div class="card" style="display:flex;gap:12px;align-items:flex-start">

        </div>
      </div>

      <div class="card" style="display:flex;gap:12px;align-items:flex-start">
        <span style="background:var(--good);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0">4</span>
        <div>
          <b>Secado al aire sobre papel absorbente</b>
          <p style="font-size:12px;color:var(--muted);margin:2px 0 0">Deja secar completamente al aire sobre papel de cocina limpio. Evita paños de tela para prevenir contaminación cruzada.</p>
        </div>
      </div>
    </div>

    <!-- Quick action reward button -->
    <div style="margin-top:16px;text-align:center">
      <button class="btn block" onclick="addPoints(10, 'Desinfección de nebulizador completada', 'hand'); playChime('success'); toast('✨ ¡Desinfección registrada! +10 Gotas FQ'); go('back');" style="cursor:pointer;font-weight:800">
        ✅ Marcar desinfección completada (+10 Gotas FQ)
      </button>
    </div>
  `],


  'points-history': ['Historial de Gotas FQ', () => {
        // Ensure pointsHistory is populated
    if(!S.pointsHistory || S.pointsHistory.length === 0){
      S.pointsHistory = [
        { id:1, desc:'¡Objetivo 100% adherencia cumplido!', pts:50, type:'goal', time:'Hoy, 16:54' },
        { id:2, desc:'Toma: Solución salina hipertónica 7%', pts:10, type:'med', time:'Hoy, 16:50' },
        { id:3, desc:'Sesión de Fisioterapia respiratoria', pts:10, type:'rp', time:'Hoy, 16:45' },
        { id:4, desc:'Lavado de manos según protocolo OMS', pts:5, type:'hand', time:'Hoy, 14:10' },
        { id:5, desc:'Toma: Enzimas pancreáticas (Kreon®)', pts:10, type:'med', time:'Hoy, 13:30' },
        { id:6, desc:'Récord en Mini-Juego Gotita FQ', pts:25, type:'game', time:'Hoy, 11:20' },
        { id:7, desc:'Vídeo visto: Manejo de nebulizadores', pts:10, type:'vid', time:'Ayer, 20:15' },
        { id:8, desc:'Ciclo de respiración guiada 4-7-8', pts:10, type:'breathe', time:'Ayer, 18:00' },
        { id:9, desc:'Toma: Antibiótico inhalado (Colistina)', pts:10, type:'med', time:'Ayer, 09:15' },
        { id:10, desc:'Racha semanal mantenida (+3 días)', pts:30, type:'streak', time:'30 oct' }
      ];
      save();
    }
    const list = S.pointsHistory;
    const lvl = getLevelInfo(S.points);
    S.level = lvl.level;
    const pct = lvl.pct;
    const icons = {
      med: '', rp: '', hand: '', game: '', vid: '📹', breathe: '', goal: '🌟', streak: ''
    };

    return `
    <div style="text-align:center;padding:6px 0 16px">
      <!-- Animated Gotita Trophy with Dynamic Level Badge -->
      <div style="width:76px;height:76px;margin:0 auto 10px;background:var(--teal-soft);border-radius:50%;display:grid;place-items:center;border:3px solid var(--teal);box-shadow:0 8px 24px rgba(0,168,152,0.2);position:relative">
        <span style="font-size:36px">${lvl.icon || ''}</span>
        <span style="position:absolute;bottom:-4px;right:-4px;background:var(--teal);color:#fff;font-size:11px;font-weight:900;padding:2px 7px;border-radius:99px;border:2px solid var(--surface)">Nv.${lvl.level}</span>
      </div>
      <h2 style="font-family:var(--heading);font-size:32px;font-weight:900;color:var(--teal);margin:0 0 2px">
        ${S.points} <span style="font-size:16px;font-weight:700;color:var(--muted)">Gotas FQ</span>
      </h2>
      <p style="font-size:15px;font-weight:800;color:var(--ink);margin:0">Nivel ${lvl.level} · ${lvl.title}</p>
      <p style="font-size:12px;color:var(--muted);margin:2px 0 0">${lvl.desc}</p>

      <!-- Level Progress Bar -->
      <div style="margin:14px 0 6px;background:var(--sunk);border-radius:99px;height:10px;overflow:hidden;position:relative">
        <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--teal),var(--good));border-radius:99px;transition:width .4s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted)">
        <span>Nivel ${lvl.level} (${lvl.minPts} pts)</span>
        <span>${lvl.isMax ? '¡Nivel Máximo alcanzado!' : `${pct}% hacia Nivel ${lvl.nextLevel} (${lvl.maxPts} pts)`}</span>
      </div>
    </div>

    <!-- Quick Stats Grid -->
    <div class="biogrid" style="margin-bottom:14px">
      <div class="bio"><b style="color:var(--good);font-size:16px">+${S.points}</b><small>Total acumulado</small></div>
      <div class="bio"><b style="color:var(--coral);font-size:16px">${streak()} días</b><small>Racha activa</small></div>
      <div class="bio"><b style="color:var(--teal);font-size:16px">${list.length}</b><small>Acciones registradas</small></div>
    </div>

    <div class="label" style="display:flex;justify-content:space-between;align-items:center">
      <span>Registro cronológico de puntos</span>
      <span style="font-size:11px;color:var(--teal);font-weight:800">Recientes</span>
    </div>

    <!-- Timeline of earned points -->
    <div class="stack" style="gap:8px">
      ${list.map(item => `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface)">
          <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;padding-right:8px">
            <span style="font-size:22px;line-height:1;flex-shrink:0">${icons[item.type] || ''}</span>
            <div style="min-width:0;overflow:hidden">
              <div style="font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(item.desc)}</div>
              <div style="font-size:11px;color:var(--muted)">${item.time}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <div style="font-size:13px;font-weight:900;color:var(--good);background:var(--good-soft);padding:3px 8px;border-radius:8px">
              +${item.pts}
            </div>
            <button class="ibtn" onclick="deletePointEntry(${item.id})" aria-label="Eliminar y restar puntos" title="Eliminar y restar ${item.pts} puntos" style="color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:none;border:none;cursor:pointer;transition:all .15s" onmouseover="this.style.color='var(--coral)';this.style.background='var(--coral-soft)'" onmouseout="this.style.color='var(--muted)';this.style.background='none'">
              ${I.trash || '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'}
            </button>
          </div>
        </div>
      `).join('')}
    </div>
    `;
  }],

  kreon:['Calculadora Enzimas (Kreon®)', ()=>`
    <h2 class="sec">Calculadora de Enzimas Pancreáticas</h2>
    <p class="sub">Guía de apoyo para ajustar las cápsulas de enzimas pancreáticas según el contenido graso del menú.</p>
    
    <div class="card" style="margin-bottom:14px;background:var(--teal-soft)">
      <b>Pauta de referencia médica</b>
      <p style="font-size:13px;margin:4px 0 0">Toma habitual: Kreon® 10.000 / 25.000 UI. Tomar siempre <b>al inicio o durante la comida</b> con abundante agua.</p>
    </div>

    <div class="label">Selecciona el tipo de comida</div>
    <div class="stack">
      ${[
        ['Snack o merienda ligera','Fruta con yogur, tortitas, galletas sencillas','1 cápsula (10.000 UI)','var(--good-soft)','var(--good)'],
        ['Comida o cena estándar','Plato de pasta, legumbres, carne magra, pescado','2 a 3 cápsulas (25.000 UI)','var(--teal-soft)','var(--teal-deep)'],
        ['Comida rica en grasas / festiva','Pizza, frituras, hamburguesas, quesos curados, tartas','3 a 4 cápsulas (25.000 UI)','var(--gold-soft)','var(--coral)']
      ].map(([t,s,d,bg,c])=>`
        <div class="card" style="background:${bg};border-left:4px solid ${c};cursor:pointer" onclick="haptic(15);toast('Dosis sugerida: ${d}');">
          <div style="font-weight:800;font-size:15px;color:var(--ink)">${t}</div>
          <div style="font-size:12px;color:var(--muted);margin:2px 0 6px">${s}</div>
          <div style="font-size:13px;font-weight:800;color:${c}">Dosis recomendada: ${d}</div>
        </div>
      `).join('')}
    </div>

    <div class="label" style="margin-top:16px">Reglas de oro médicas</div>
    <div class="card">
      <ul style="margin:0;padding-left:18px;font-size:13px;display:grid;gap:6px">
        <li><b>Nunca masticar:</b> Los microgránulos tienen cubierta entérica; masticarlos daña la boca y el esófago.</li>
        <li><b>Comidas prolongadas:</b> Si la comida dura más de 30 minutos, reparte las cápsulas (la mitad al empezar, la mitad a la mitad).</li>
        <li><b>Espaciar del hierro:</b> No tomar suplementos de hierro a la misma hora que los enzimas.</li>
      </ul>
    </div>
  `],

  sputum:['Registro de Tos y Exacerbaciones', ()=>{
    const list = S.sputumLog || [];
    const activeCode = S.lastSputum || 'M1';
    const curCough = S.lastCough || 'Tos habitual';

    return `
    <h2 class="sec">Escala de Esputo (Murray)</h2>
    <p class="sub">Monitoriza cambios en las secreciones bronquiales para anticipar brotes infecciosos antes de que empeoren.</p>

    <div class="label">Color y aspecto del esputo hoy (Pulsa para guardar)</div>
    <div class="stack">
      ${[
        ['M1', '⚪ M1: Mucoide claro / Salivar', 'Normalidad en fase basal estable', 'var(--sunk)', 'var(--teal)'],
        ['M2', '🟡 M2: Mucopurulento amarillento', 'Aumento leve de secreción o inicio de catarro', 'var(--gold-soft)', 'var(--gold)'],
        ['M3', '🟢 M3: Purulento verdoso', 'Probable proliferación bacteriana (Pseudomonas / S. aureus)', 'var(--good-soft)', 'var(--good)'],
        ['M4', '🔴 M4: Hemoptoico (estrías de sangre)', '¡Aviso al equipo médico! Precisa reposo de fisio', 'var(--coral-soft)', 'var(--coral)']
      ].map(([code, title, desc, bg, color])=>`
        <div class="card" style="background:${bg};border:2px solid ${activeCode===code?color:'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:space-between" onclick="recordSputum('${code}', '${esc(title)}', '${esc(desc)}')">
          <div>
            <b style="font-size:14px;color:var(--ink)">${title}</b>
            <p style="font-size:12px;color:var(--muted);margin:2px 0 0">${desc}</p>
          </div>
          ${activeCode===code?`<span style="font-size:11px;font-weight:800;color:${color};background:rgba(255,255,255,0.7);padding:3px 8px;border-radius:8px">✔ Guardado</span>`:''}
        </div>
      `).join('')}
    </div>

    <div class="label" style="margin-top:16px">Frecuencia de la tos</div>
    <div class="chips">
      ${['Tos habitual', 'Tos seca irritativa', 'Tos húmeda con fatiga', 'Tos nocturna que despierta'].map(x=>`
        <button class="chip" style="${curCough===x?'background:var(--teal);color:#fff;border-color:var(--teal)':''}" onclick="recordCough('${x}')">${x}</button>
      `).join('')}
    </div>

    <!-- Visible Sputum History Timeline -->
    <div class="label" style="display:flex;justify-content:space-between;align-items:center;margin-top:22px">
      <span>Historial de Registros Guardados</span>
      <span style="font-size:11px;color:var(--teal);font-weight:800">${list.length} entradas</span>
    </div>

    <div class="stack" style="gap:8px">
      ${list.length ? list.map(item => `
        <div class="card" style="padding:10px 14px;background:var(--surface)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">
            <b style="font-size:13px;color:var(--teal)">${item.desc.split(':')[0]}</b>
            <span style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11px;color:var(--muted)">${item.time}</span>
              <button type="button" class="chip" aria-label="Borrar entrada" onclick="askDeleteSputum(${item.id}, this)" style="padding:2px 8px;font-size:12px;min-height:0;cursor:pointer">×</button>
            </span>
          </div>
          <div style="font-size:12px;color:var(--ink)">${item.status}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px">
            <span style="display:inline-block;background:var(--sunk);padding:2px 6px;border-radius:4px">${item.cough || 'Tos habitual'}</span>
          </div>
        </div>
      `).join('') : '<p class="sub">Aún no hay registros de esputo guardados.</p>'}
    </div>
    `;
  }],

  nebulize:['Sesión de Nebulización Guiada', ()=>`
    <div style="text-align:center;padding:10px 0">
      <h2 class="sec" style="margin:0">Sesión Acompañada</h2>
      <p class="sub">15 minutos de nebulización con estimulador de depósito bronquial distal.</p>

      <div style="margin:20px auto;width:180px;height:180px;border-radius:50%;background:var(--teal-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--teal);box-shadow:0 0 30px rgba(0,168,152,0.25)">
        <span id="neb-timer" style="font-size:36px;font-weight:900;color:var(--teal);font-family:var(--heading)">15:00</span>
        <small style="color:var(--muted);font-weight:700">Nebulizando </small>
      </div>

      <p style="font-size:14px;color:var(--ink);margin:0 0 16px"><b>Ritmo sugerido:</b> Inhala lentamente por la boca y mantén el aire 2 segundos antes de soltarlo.</p>

      <div class="row" style="justify-content:center;gap:10px">
        <button class="btn" onclick="haptic(15);playChime('success');toast('Sonido relajante activado');">🎵 Sonido ambiente</button>
        <button class="btn coral" data-go="tab:tratamiento" onclick="haptic(25);playChime('success');toast('¡Sesión completada! +20 Gotas FQ');">Finalizar (+20 pts)</button>
      </div>
    </div>
  `],

  diag:['Diagnóstico', ()=>`
    <h2 class="sec">¿En qué consiste?</h2>
    <p>El diagnóstico se lleva a cabo a partir de una serie de pruebas que determinan cuales son los síntomas de cada paciente. Los síntomas son la forma que tiene nuestro cuerpo de advertirnos sobre una enfermedad.</p>
    <p class="sub">A continuación, rellena los formularios para registrar tu diagnóstico y tus síntomas. Esto te servirá para ser consciente de tu situación y ver como es tu evolución. Tu respuesta es modificable para que puedas ir cambiándola con el paso del tiempo.</p>
    
    <div class="label">Tu diagnóstico</div>
    <div class="chips">${DIAG.map(x=>`<button class="chip" data-act="tg" data-l="diag" data-v="${esc(x)}" aria-pressed="${S.diag.includes(x)}">${x}</button>`).join('')}</div>

    <div class="label">Tus síntomas actualmente</div>
    <div class="chips">${SINT.map(x=>`<button class="chip c" data-act="tg" data-l="sint" data-v="${esc(x)}" aria-pressed="${S.sint.includes(x)}">${x}</button>`).join('')}</div>

    <!-- In-App Integrated Document -->
    <div class="doc-banner" style="margin-top:16px">
      <div>
        <b>Info sobre el diagnóstico y síntomas</b>
        <p>Bases genéticas, cribado neonatal y pruebas diagnósticas</p>
      </div>
      <button class="btn sm" data-go="page:doc-diag">${I.doc} Leer</button>
    </div>`],

  prev:['Prevención', ()=>`
    <p>Las principales dos formas de prevenir infecciones u otras enfermedades son las siguientes:</p>
    <div class="stack" style="margin-top:12px">
      <button class="mod" data-go="page:manos"><span class="ic" style="background:var(--t1);color:var(--teal)">${I.prev}</span><b>Limpiarse las manos</b><span>Pasos, momentos clave y recordatorios</span></button>
      <button class="mod" data-go="page:vacunas"><span class="ic" style="background:var(--t2);color:var(--coral)">${I.med}</span><b>Vacunarse</b><span>Cuáles necesitas y cuáles llevas</span></button>
    </div>
    <div class="label">Medidas de prevención cruzada</div>
    <ul>
      <li>Mantener al menos 2 metros de distancia con otras personas con FQ.</li>
      <li>Evitar compartir aerosoles o dispositivos de fisioterapia.</li>
      <li>Limpieza y esterilización del nebulizador tras cada uso.</li>
    </ul>`],

  manos:['Limpiarse las manos', ()=>`
    <p>Para mantener una buena higiene y prevenir infecciones es importante limpiarse las manos antes de comer, después, al tener contacto con superfícies propensas a tener bacterias... Con tal de no olvidarte activa nuestro recordatorio.</p>
    
    <button class="btn block" data-act="hand-modal" style="margin-bottom:12px;background:var(--teal-deep)">
      ${I.timer} Abrir temporizador guiado de lavado (60s)
    </button>
    
    <div class="label">Los pasos a seguir según la OMS</div>
    <ol class="steps">
      <li>Mójate las manos y aplica abundante jabón.</li>
      <li>Frota las palmas entre sí con energía.</li>
      <li>Frota el dorso de cada mano con los dedos entrelazados.</li>
      <li>Frota entre los dedos y nudillos.</li>
      <li>Frota los pulgares con movimientos rotatorios.</li>
      <li>Frota las yemas de los dedos sobre la palma para limpiar las uñas.</li>
      <li>Aclara bien con agua y seca con toalla de papel de un solo uso.</li>
    </ol>

    <div class="label">Tus recordatorios de limpieza</div>
    <div class="card">
      ${S.reminders.length?S.reminders.map(r=>`
        <div class="line">
          <div><b>${esc(r.time)} · ${esc(r.title)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:''}</div>
          <button class="ibtn" data-act="delrem" data-id="${r.id}" aria-label="Borrar">${I.trash}</button>
        </div>`).join(''):'<p class="sub" style="margin:0">Sin recordatorios configurados.</p>'}
    </div>
    <button class="btn ghost block" style="margin-top:10px" data-act="newrem">Añadir recordatorio</button>`],

  vacunas:['Vacunas', ()=>`
    <p>Vacunarse es esencial. Resulta importante para evitar contraer enfermedades y la propagación de estas. En el caso de pacientes con enfermedades crónicas (como la Fibrosis Quística) su importancia aumenta con creces, por lo que hay que llevar al tanto las vacunas.</p>
    
    <div class="label">Fichas de vacunas</div>
    <div class="stack">
      ${VACINFO.map(([n,d])=>`
        <div class="card" style="padding:10px 12px">
          <div class="between">
            <b>${n}</b>
            <button class="pill ${S.vacc[n]?'ok':'due'}" data-act="vac" data-n="${n}">${S.vacc[n]?'Puesta':'Pendiente'}</button>
          </div>
          <p style="font-size:12px;color:var(--muted);margin-top:4px">${d}</p>
        </div>`).join('')}
    </div>

    <p class="sub" style="margin-top:12px">En caso que no lleves todas las vacunas puestas pide cita con tu médico y añade la fecha de vacunación en el calendario.</p>
    <button class="btn block" data-act="newev" data-type="vacuna">Añadir vacunación al calendario</button>`],

  nutri:['Nutrición', ()=>{

  'doc-diag':['Diagnóstico y Síntomas', ()=>`
    <div class="doc-article">
      <h2 class="sec">Diagnóstico y Manifestaciones Clínicas en la FQ</h2>
      <p><i>Documento clínico integrado del Treball de Recerca (2022) · Validado con especialistas en neumología.</i></p>

      <h3>1. ¿Cómo se hereda la enfermedad?</h3>
      <p>La Fibrosis Quística es una patología genética autosómica recesiva producida por alteraciones en el gen <b>CFTR</b> ubicado en el brazo largo del cromosoma 7. Para manifestar la enfermedad es necesario haber heredado una copia mutada de cada progenitor. Cuando ambos progenitores son portadores sanos, existe una probabilidad del 25% en cada embarazo de tener un hijo con FQ.</p>

      <h3>2. Procedimiento diagnóstico estándar</h3>
      <ol>
        <li><b>Cribado neonatal (Screening metabólico):</b> Se realiza a los recién nacidos entre las 48 y 72 horas de vida mediante la prueba del talón, midiendo los niveles del tripsinógeno inmunorreactivo (TIR). Si el TIR está elevado, se procede al estudio genético.</li>
        <li><b>Test del sudor (Iontoforesis cuantitativa):</b> Es la prueba confirmatoria de referencia (Gibson & Cooke con pilocarpina y Macroduct). Valores superiores a <b>60 mEq/L</b> confirman el diagnóstico de FQ.</li>
        <li><b>Diagnóstico molecular directo:</b> Identificación de las mutaciones específicas en el gen CFTR (siendo la deleción F508del la más prevalente en la población caucásica).</li>
        <li><b>Diferencia de potencial transepitelial nasal (DPE):</b> Utilizada en casos dudosos con pruebas del sudor limítrofes. Valores inferiores a <b>-40 mV</b> orientan a patología.</li>
      </ol>

      <h3>3. Manifestaciones clínicas por órganos</h3>
      <ul>
        <li><b>Aparato respiratorio:</b> Secreciones bronquiales hiperviscosas, obstrucción de las vías aéreas distales, tos persistente, bronquiectasias e infecciones crónicas recurrentes por patógenos oportunistas (<i>Pseudomonas aeruginosa</i>, <i>Staphylococcus aureus</i>).</li>
        <li><b>Aparato digestivo y páncreas:</b> En el 85-90% de los pacientes se produce insuficiencia pancreática exocrina por obstrucción de los conductos acinares, impidiendo la secreción de lipasa y proteasa, derivando en esteatorrea (heces grasas) y malabsorción severa de grasas y vitaminas liposolubles.</li>
        <li><b>Crecimiento y estado nutricional:</b> Dificultad para ganar peso y retraso del crecimiento en la infancia a pesar de ingestas aparentemente normales.</li>
        <li><b>Piel:</b> Concentración elevada de sal en el sudor ("sabor salado al besar la frente del lactante").</li>
      </ul>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a Diagnóstico</button>
    </div>`],

  'doc-nutri-detall':['Guía de Nutrición FQ', ()=>`
    <div class="doc-article">
      <h2 class="sec">Guía Nutricional y Suplementación FQ</h2>
      <p><i>Directrices nutricionales del Treball de Recerca (2022) · Adaptadas a cada etapa evolutiva.</i></p>

      <h3>1. Principios de la dieta hipercalórica</h3>
      <p>Los pacientes con fibrosis quística requieren entre un <b>120% y un 150% de la energía diaria recomendada</b> para personas de su misma edad y sexo. Este gasto elevado responde al mayor esfuerzo respiratorio, a las infecciones pulmonares recurrentes y a la malabsorción digestiva.</p>

      <h3>2. Fórmulas y suplementos orales específicos</h3>
      <p>Cuando la dieta habitual enriquecida no basta para mantener el percentil de peso óptimo, se prescriben suplementos específicos:</p>
      <ul>
        <li><b>Isosource® energético / Ensure Plus® / Sustacal®:</b> Suplementos orales hipercalóricos e hiperproteicos para aumentar calorías sin incrementar el volumen de comida.</li>
        <li><b>Ensure Pudding® / Sustacal Pudding®:</b> Presentación en textura crema ideal como postre o merienda densa.</li>
        <li><b>Isosource Energy®:</b> Formulación indicada en pacientes que presenten intolerancia a hidratos de carbono o diabetes relacionada con la FQ (CFRD).</li>
        <li><b>Oxepa®:</b> Fórmula especializada enriquecida con ácidos grasos específicos indicada cuando existe afectación respiratoria severa.</li>
      </ul>

      <h3>3. Suplementación vitamínica y mineral por grupos de edad</h3>
      <table class="doc-table">
        <thead><tr><th>Nutriente</th><th>Edad</th><th>Dosis orientativa diaria</th></tr></thead>
        <tbody>
          <tr><td><b>Vitamina D</b></td><td>Lactantes (0-12 m)</td><td>400 – 500 UI / día</td></tr>
          <tr><td><b>Vitamina D</b></td><td>Niños (1-10 años)</td><td>800 – 1.000 UI / día</td></tr>
          <tr><td><b>Vitamina E</b></td><td>Niños (1-4 años)</td><td>100 UI / día</td></tr>
          <tr><td><b>Vitamina E</b></td><td>Niños (4-10 años)</td><td>100 – 120 UI / día</td></tr>
          <tr><td><b>Vitamina E</b></td><td>Adolescentes (>10 años)</td><td>200 – 400 UI / día</td></tr>
          <tr><td><b>Vitamina K</b></td><td>Niños > 1 año</td><td>5 mg (2 veces/sem en antibióticos)</td></tr>
          <tr><td><b>Calcio</b></td><td>1 a 3 años</td><td>450 mg / día</td></tr>
          <tr><td><b>Calcio</b></td><td>4 a 10 años</td><td>800 mg / día</td></tr>
          <tr><td><b>Calcio</b></td><td>11 a 17 años</td><td>1.150 mg / día</td></tr>
          <tr><td><b>Sodio (sal)</b></td><td>Todas las edades</td><td>Salar las comidas o cápsulas de cloruro sódico</td></tr>
          <tr><td><b>Zinc</b></td><td>2 a 18 años</td><td>15 mg/kg/día si hay riesgo de déficit</td></tr>
        </tbody>
      </table>

      <h3>4. Terapia de sustitución enzimática (Kreon®)</h3>
      <p>Las enzimas deben tomarse <b>siempre inmediatamente al inicio de cada comida</b> que contenga grasas o proteínas. En lactantes, los microgránulos nunca deben triturarse y se mezclan con una pequeña cucharada de puré ácido (como manzana).</p>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a Nutrición</button>
    </div>`],

  'doc-fisio':['Manual de Técnicas RP', ()=>`
    <div class="doc-article">
      <h2 class="sec">Manual Detallado de Técnicas Respiratorias</h2>
      <p><i>Compendio clínico de rehabilitación pulmonar del Treball de Recerca (2022).</i></p>

      <h3>1. Técnica de Espiración Forzada (TEF o "Huffing")</h3>
      <p>Consiste en una o dos espiraciones forzadas con la glotis abierta, comenzando a volumen pulmonar medio y continuando hasta un volumen pulmonar bajo, como si quisiéramos empañar un espejo grande a cierta distancia. Esta técnica aprovecha el punto de igual presión para desprender el moco de los bronquios medianos y pequeños hacia las vías centrales sin provocar el colapso prematuro de la pared bronquial.</p>

      <h3>2. Presión Expiratoria Positiva (PEP)</h3>
      <p>Mediante una mascarilla o boquilla acoplada a una resistencia calibrada, el paciente exhala contra una presión positiva continua. Esto previene el colapso dinámico de la vía aérea durante la espiración y favorece la ventilación colateral, permitiendo que el aire penetre por detrás de los tapones de moco y los empuje hacia el exterior.</p>
      <p><b>Pauta habitual:</b> 10 a 15 respiraciones seguidas de 2 o 3 huffings y tos eficaz, repetido durante unas 3 o 4 tandas (aproximadamente 20 minutos de sesión diaria).</p>

      <h3>3. Dispositivos de Presión Positiva Oscilante (O-PEP)</h3>
      <p>Dispositivos mecánicos como el <b>Flutter®</b> o <b>Acapella®</b> que combinan la resistencia espiratoria positiva con oscilaciones acústicas intratorácicas (10 a 30 Hz). Estas vibraciones mecánicas reducen la viscoelasticidad del moco y facilitan su desprendimiento de las paredes ciliadas.</p>

      <h3>4. Drenajes posturales y Clapping</h3>
      <p>Colocación del paciente en posiciones gravitacionales específicas según el segmento pulmonar afectado. En caso de difícil expectoración, se añaden suaves percusiones rítmicas con la mano ahuecada (<i>clapping</i>) sobre la caja torácica para movilizar las secreciones adheridas.</p>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a RP-Técnicas</button>
    </div>`],

  'doc-esport':['Actividad Física en FQ', ()=>`
    <div class="doc-article">
      <h2 class="sec">Actividad Física y Entrenamiento en FQ</h2>
      <p><i>Capítulo de ejercicio terapéutico del Treball de Recerca (2022).</i></p>

      <h3>1. El ejercicio como terapia complementaria</h3>
      <p>En el manejo moderno de la fibrosis quística, el ejercicio físico regular ha demostrado ser una herramienta de primer orden, llegando en determinados perfiles clínicos estables a complementar o sustituir parte de las técnicas clásicas de fisioterapia pasiva.</p>

      <h3>2. Beneficios fisiológicos demostrados</h3>
      <ul>
        <li><b>Mejora del aclaramiento mucociliar:</b> El incremento del flujo aéreo durante el ejercicio aeróbico moviliza el moco sin necesidad de dispositivos mecánicos.</li>
        <li><b>Aumento de la capacidad aeróbica (VO₂ máx):</b> Correlacionado directamente con una mayor supervivencia y menor número de exacerbaciones respiratorias.</li>
        <li><b>Preservación de la densidad mineral ósea:</b> Los ejercicios con carga de peso previenen la osteopenia y osteoporosis precoz.</li>
        <li><b>Fuerza de la musculatura respiratoria y torácica:</b> Favorece una tos más potente y protectora.</li>
      </ul>

      <h3>3. Deportes recomendados y precauciones</h3>
      <ul>
        <li><b>Recomendados:</b> Natación, carrera suave, bicicleta, cama elástica, juegos de pelota y entrenamiento funcional con gomas elásticas.</li>
        <li><b>Precaución hídrica:</b> Debido a la mayor pérdida de cloruro sódico por el sudor, es fundamental asegurar una <b>hidratación abundante con suplemento extra de sal</b> antes, durante y después del ejercicio en días calurosos.</li>
      </ul>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a RP-Técnicas</button>
    </div>`],

  'doc-tractaments':['Guía de Tratamientos', ()=>`
    <div class="doc-article">
      <h2 class="sec">Guía Completa de Tratamientos en FQ</h2>
      <p><i>Revisión terapéutica del Treball de Recerca (2022) · Pilares farmacológicos actuales.</i></p>

      <h3>1. Antibioterapia respiratoria</h3>
      <p>Dirigida a erradicar o controlar la colonización crónica bacteriana:</p>
      <ul>
        <li><b>Antibióticos inhalados:</b> Tobramicina (solución o polvo seco), Colistimetato de sodio y Aztreonam lisina. Se administran directamente por vía inhalatoria para conseguir concentraciones locales muy elevadas en el pulmón con mínima absorción sistémica y menores efectos secundarios.</li>
        <li><b>Antibioterapia oral o intravenosa:</b> Empleada en episodios de exacerbación bronquial o infección aguda según antibiograma de esputo.</li>
      </ul>

      <h3>2. Terapia mucolítica e hidratante</h3>
      <ul>
        <li><b>Suero salino hipertónico (7%):</b> Atrae agua hacia la luz bronquial por gradiente osmótico, rehidratando la capa mucosa periciliar y reduciendo la viscosidad del moco para facilitar su expulsión.</li>
        <li><b>Dornasa alfa (Pulmozyme®):</b> Enzima recombinante que rompe las hebras de ADN extracelular liberado por los neutrófilos muertos en el esputo infectado.</li>
      </ul>

      <h3>3. Moduladores de la proteína CFTR</h3>
      <p>Representan el mayor hito terapéutico al tratar la causa molecular de la patología y no únicamente sus síntomas. Fármacos orales (como la triple terapia elexacaftor/tezacaftor/ivacaftor - Kaftrio®) que potencian la apertura del canal y corrigen el plegamiento celular de la proteína mutada, normalizando la función pulmonar y reduciendo los niveles de cloro en sudor.</p>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a Medicación</button>
    </div>`],

  'doc-motivacio':['Motivación y Bienestar', ()=>`
    <div class="doc-article">
      <h2 class="sec">Espacio de Motivación y Bienestar Emocional</h2>
      <p><i>Aspectos psicosociales y vivencia del paciente del Treball de Recerca (2022).</i></p>

      <h3>1. Convivir con una rutina exigente</h3>
      <p>Vivir con fibrosis quística exige dedicar diariamente entre 1 y 3 horas a tratamientos invisibles para los demás: nebulizaciones, fisioterapia, toma rigurosa de enzimas con cada comida, pastillas y desinfección meticulosa. Es completamente natural experimentar momentos de fatiga, frustración o sobrecarga emocional ("burnout" del tratamiento).</p>

      <h3>2. Estrategias psicológicas de resiliencia</h3>
      <ul>
        <li><b>Normalizar las emociones:</b> Sentirse cansado o desanimado algunos días no significa rendirse. Acepta el bajón sin juzgarte y apóyate en quienes te rodean.</li>
        <li><b>Hacer del tratamiento un momento propio:</b> Aprovecha las nebulizaciones para escuchar tu música preferida, ver series o jugar a videojuegos. Convierte la rutina en un espacio de desconexión.</li>
        <li><b>La fuerza de la red de apoyo:</b> Compartir tus sentimientos con tu familia, amigos de confianza o el equipo de psicología de la unidad FQ alivia la carga de forma decisiva.</li>
        <li><b>Celebrar cada pequeño logro:</b> Cada día que cumples con tu pauta estás sumando salud, capacidad respiratoria y futuro. Eres un ejemplo de constancia y valentía.</li>
      </ul>
      <button class="btn block" data-act="back" style="margin-top:20px">Volver a Salud Mental</button>
    </div>`],

  'doc-chill-read':['Rincón de Lectura Chill', ()=>{
    let tab = window._chillTab || 'stories';
    let selStory = window._chillStory || 0;

    const stories = [
      {
        t: "1. El viento y el roble",
        sub: "Sobre la paciencia y la flexibilidad · Lectura: 1 min",
        body: `<p>Cuentan que en lo alto de una colina crecía un roble centenario cuyas ramas habían resistido cientos de inviernos tormentosos. Un día, una brisa suave pero persistente comenzó a soplar a través de sus hojas.</p>
        <p>El roble, cansado de luchar contra las ventiscas, le preguntó a la brisa: <i>—¿Cómo logras viajar tan lejos sin agotarte nunca?</i></p>
        <p>La brisa sonrió con un murmullo fresco y le respondió: <i>—Porque yo no lucho contra los obstáculos que encuentro en el camino. Los rodeo, respiro profundo con cada curva y sigo avanzando paso a paso. Mi fuerza no está en derribar muros, sino en nunca dejar de moverme.</i></p>
        <p>El roble comprendió entonces que no hacía falta ganar todas las batallas con esfuerzo desmedido; bastaba con mantenerse firme en sus raíces, respirar hondo y permitir que el aire fluyera a través de él.</p>`
      },
      {
        t: "2. El faro en la niebla",
        sub: "Constancia en días difíciles · Lectura: 1.5 min",
        body: `<p>En un acantilado escarpado se alzaba un viejo faro de piedra. Durante las noches cerradas, una niebla espesa y densa envolvía toda la costa, haciendo imposible ver más allá de dos pasos.</p>
        <p>El vigilante del faro encendía puntualmente la lámpara cada anochecer. Un día, un marinero le preguntó: <i>—¿Para qué gastas aceite si la niebla es tan espesa que apenas alumbra el borde del muelle?</i></p>
        <p>El farero sonrió con serenidad: <i>—Mi luz no necesita despejar toda la tormenta ni iluminar todo el océano a la vez. Solo necesita estar encendida para el barco que esté justo a punto de encontrar su rumbo.</i></p>
        <p>En los días de niebla y cansancio, no necesitas tener todo el futuro resuelto; basta con encender tu pequeña luz hoy y cumplir con el cuidado de este momento.</p>`
      },
      {
        t: "3. El suspiro de las olas",
        sub: "El ritmo natural de la respiración · Lectura: 1 min",
        body: `<p>Si te sientas en la orilla del mar con los ojos cerrados, notarás que las olas nunca tienen prisa. Avanzan con un rumor suave, acarician la arena durante unos segundos en calma y luego retroceden sin resistencia para volver a empezar.</p>
        <p>Nunca compiten entre sí, ni intentan ser más grandes de lo que el viento les pide. Simplemente fluyen en un ciclo interminable de entrega y recogida.</p>
        <p>Tus pulmones funcionan exactamente igual: inhalan la vida con frescura, sostienen la energía y sueltan todo lo que sobra al exhalar. Cada nebulización es solo un regreso a ese ritmo natural del mar.</p>`
      },
      {
        t: "4. La melodía del bambú",
        sub: "La fuerza de dejar pasar el aire · Lectura: 1.5 min",
        body: `<p>En los bosques orientales, el bambú crece esbelto y hueco por dentro. Cuando llegan los tifones más feroces que arrancan árboles centenarios de raíz, el bambú se dobla casi hasta tocar el suelo... pero no se quiebra jamás.</p>
        <p>Al pasar la tormenta, el bambú se yergue de nuevo hacia el sol con elegancia intacta. Su secreto no es ser el más duro ni el más pesado, sino estar vacío y ligero por dentro, permitiendo que el viento cruce sus cañas produciendo una hermosa melodía en lugar de resistencia.</p>
        <p>Cuando sientas el peso de la rutina, sé como el bambú: suelta la tensión interna, mantén tus raíces fuertes y deja que la corriente pase.</p>`
      },
      {
        t: "5. El viaje de la pequeña gota",
        sub: "El valor de cada pequeño hábito · Lectura: 1 min",
        body: `<p>Una diminuta gota de rocío reposaba sobre una hoja de helecho en lo profundo del valle. Miraba a lo lejos el gran río caudaloso y pensaba: <i>«¿Qué importancia puedo tener yo, tan pequeña e invisible?»</i></p>
        <p>Un rayo de sol la calentó suavemente y le susurró: <i>—Sin ti, y sin miles de gotas como tú que brotan cada mañana en la montaña, ese gran río navegable no sería más que un cauce de piedras secas.</i></p>
        <p>Cada comprimido, cada lavado de manos y cada sesión de aerosolterapia parecen gestos pequeños en el calendario, pero sumados forman el caudal inmenso de tu salud y tu vitalidad.</p>`
      },
      {
        t: "6. Las alas del vencejo",
        sub: "Volar alto incluso con viento en contra · Lectura: 1.5 min",
        body: `<p>El vencejo es una de las aves más extraordinarias del planeta: duerme, come y vive en el aire, recorriendo miles de kilómetros sin posarse durante meses.</p>
        <p>Para despegar, el vencejo necesita abrir sus alas largas frente al viento. Cuanto más sopla el aire en su contra, mayor es la sustentación que consiguen sus plumas para elevarse sobre las nubes.</p>
        <p>Los desafíos crónicos son como ese viento de cara: exigen técnica, constancia y paciencia, pero también te enseñan a volar con una altura y una madurez que pocos llegan a conocer.</p>`
      },
      {
        t: "7. El jardín de la paciencia",
        sub: "Cuidarse cada día florece con el tiempo · Lectura: 1 min",
        body: `<p>Un joven jardinero plantó un bulbo en una maceta y la regaba cada mañana. Al tercer día, impaciente porque no veía brotes, escarbó la tierra para ver si la raíz estaba creciendo.</p>
        <p>El viejo sabio del pueblo lo detuvo con suavidad: <i>—Hijo, las cosas más fuertes y hermosas echan primero raíces hondas en la oscuridad antes de que puedas ver su primera flor. Si escarbas cada día buscando resultados inmediatos, solo dañarás la raíz. Confía en el agua y el sol de hoy.</i></p>
        <p>La adherencia a tu tratamiento es ese riego silencioso. Aunque no siempre notes un cambio de un día para otro, tus pulmones se están fortaleciendo por dentro.</p>`
      },
      {
        t: "8. La montaña y el eco",
        sub: "La voz interior que te acompaña · Lectura: 1 min",
        body: `<p>Un caminante subía un sendero empinado sintiendo el cansancio en las piernas. Agotado, gritó al valle: <i>—¡Estoy cansado!</i> y el eco le devolvió amplificado: <i>—¡Estoy cansado!</i></p>
        <p>Se detuvo, respiró hondo, bebió un sorbo de agua fresca y decidió probar de nuevo: <i>—¡Un paso más, tú puedes!</i> Y el valle entero resonó con miles de voces diciendo: <i>—¡Tú puedes!</i></p>
        <p>La mente es ese eco: lo que te dices a ti misma durante los 15 minutos de nebulización marca la diferencia. Háblate siempre con admiración y ternura.</p>`
      },
      {
        t: "9. El té bajo la lluvia",
        sub: "El arte de la pausa consciente · Lectura: 1 min",
        body: `<p>En una aldea de montaña comenzó a diluviar torrencialmente. La mayoría de los viajeros corrían aturdidos buscando refugio a gritos, enfadados porque la lluvia retrasaba sus viajes.</p>
        <p>Un anciano posadero, en cambio, puso a hervir agua, preparó una tetera humeante de manzanilla y menta, se sentó en el porche y contempló las gotas caer sobre los tejados con una sonrisa de gratitud.</p>
        <p>A veces la vida nos obliga a hacer pausas. Puedes vivirlas con frustración o convertirlas en tu té caliente: 15 minutos diarios de regalo para ti, para tus pensamientos y tu tranquilidad.</p>`
      },
      {
        t: "10. Las estrellas en la noche clara",
        sub: "La luz en los días más densos · Lectura: 1 min",
        body: `<p>Cuando el sol se oculta y la noche se vuelve completamente oscura, en las ciudades pensamos que el cielo se ha apagado. Pero basta con alejarse del ruido para descubrir que el firmamento está poblado por millones de estrellas que siempre estuvieron ahí.</p>
        <p>Solo en la noche más oscura se hacen visibles las constelaciones más lejanas y hermosas.</p>
        <p>En los días de bajón o cansancio, recuerda que no estás a oscuras: tu valentía, tu comunidad, tu familia y tu propia constancia son estrellas que brillan con más fuerza que nunca.</p>`
      }
    ];

    const quotes = [
      "Un pódcast o tu música favorita dura exactamente lo mismo que una nebulización. Convierte tu tratamiento en tu momento favorito del día.",
      "Cada respiración profunda y consciente es un abrazo de oxígeno para tus pulmones.",
      "La constancia de hoy es la energía, la tranquilidad y la libertad de mañana.",
      "No tienes que ser invencible a todas horas; basta con dar el paso de hoy con cariño y paciencia.",
      "Tus pulmones hacen un trabajo heroico cada día: cuídalos y celébralos en cada toma.",
      "15 minutos de nebulizador no son tiempo perdido; son 15 minutos para soñar, escuchar y recargar fuerzas.",
      "Inhala calma, exhala tensión. El aire siempre encuentra su camino de vuelta cuando sueltas las prisas.",
      "Las gotas pequeñas llenan océanos enteros: cada tratamiento diario suma en tu bienestar a largo plazo.",
      "Cuidarse no es una tarea más de la lista, es tu mayor y más valioso acto de amor propio.",
      "La verdadera fuerza no está en no cansarse nunca, sino en saber descansar y volver a sonreír con ganas."
    ];

    return `
    <div style="margin-bottom:14px">
      <h2 class="sec" style="margin:0 0 2px">Rincón de Lectura Chill</h2>

        <button class="btn sm ${tab==='quotes'?'':'ghost'}" style="flex:1;border:none;${tab==='quotes'?'background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.06)':''}" onclick="window._chillTab='quotes';rerender()">

  'doc-tr':['Sobre el Proyecto TR', ()=>`
    <div class="doc-article">
      <h2 class="sec">Sobre el Proyecto "FQ-UP" (2022)</h2>
      <p><i>Memoria del Treball de Recerca de Batxillerat · Autora: Hira Sheikh Ahmed.</i></p>

      <h3>Resumen del proyecto</h3>
      <p>Este trabajo consistió en la investigación exhaustiva de la Fibrosis Quística con el objetivo de diseñar y desarrollar una aplicación móvil adaptada a las necesidades reales de los pacientes y alineada con los criterios de la <b>Federación Española de Fibrosis Quística (FEFQ)</b> y la <b>Associació Valenciana de Fibrosi Quística</b>.</p>

      <h3>Agradecimientos especiales</h3>
      <p>Gracias a mi madre, por su apoyo incondicional en cada paso de este camino.</p>
      <p>Gracias a la Fundación Española de Fibrosis Quística y a la Associació Valenciana de Fibrosi Quística, por abrirme las puertas y confiar en este proyecto.</p>

/* Interactive Mini-Game Engine/* Interactive Mini-Game Engine: Gotita FQ */
let gameLoopId = null;
function initMiniGame(){
  const canvas = document.getElementById('game-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  
  let playerX = 145;
  const playerY = 320;
  const playerW = 48;
  const playerH = 48;
  let score = 0;
  let items = [];
  let isGameOver = false;
  let spawnTimer = 0;

  function spawnItem(){
    const isEnzyme = Math.random() < 0.25;
    const isBacteria = Math.random() < 0.35;
    items.push({
      x: 20 + Math.random() * (canvas.width - 50),
      y: -20,
      speed: 2 + Math.random() * 2,
      type: isBacteria ? 'bacteria' : (isEnzyme ? 'enzyme' : 'drop'),
      size: isBacteria ? 24 : 20
    });
  }

  function gameUpdate(){
    if(isGameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw background grid lines
    ctx.strokeStyle = '#D5F2EE';
    ctx.lineWidth = 1;
    for(let y=0; y<canvas.height; y+=30){
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Spawn items
    spawnTimer++;
    if(spawnTimer > 35){
      spawnItem();
      spawnTimer = 0;
    }

    // Update & draw items
    for(let i=items.length-1; i>=0; i--){
      const item = items[i];
      item.y += item.speed;

      if(item.type === 'drop'){
        // Water drop (teal)
        ctx.fillStyle = '#00A898';
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px Nunito';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+10', item.x, item.y);
      } else if(item.type === 'enzyme'){
        // Enzyme capsule (gold pill)
        const pw = item.size * 1.35, ph = item.size * 0.75;
        ctx.fillStyle = '#DA931E';
        ctx.beginPath();
        ctx.roundRect(item.x - pw/2, item.y - ph/2, pw, ph, ph/2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 9px Nunito';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+25', item.x, item.y);
      } else {
        // Bacteria / Dust cloud (coral circle)
        ctx.fillStyle = '#E26237';
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 12px Nunito';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕', item.x, item.y);
      }

      // Check collision with player
      if(item.y + item.size/2 >= playerY && item.y - item.size/2 <= playerY + playerH &&
         item.x + item.size/2 >= playerX && item.x - item.size/2 <= playerX + playerW){
        if(item.type === 'bacteria'){
          // Game Over
          isGameOver = true;
          playChime('game-over');
          if(score > (S.highScore||0)){
            S.highScore = score;
            save();
          }
          S.points += Math.floor(score / 5);
          save();
          break;
        } else {
          // Collected item
          score += (item.type === 'enzyme' ? 25 : 10);
          playChime('game-point');
          document.getElementById('g-score').textContent = score;
          items.splice(i, 1);
        }
      } else if(item.y > canvas.height + 20){
        items.splice(i, 1);
      }
    }

    // Draw Player Mascot Gotita with true teardrop (water drop) shape
    const px = playerX + playerW/2;
    const py = playerY + playerH/2;
    const pr = playerW/2;

    ctx.save();
    // Teardrop path with pointed tip at top
    ctx.fillStyle = '#00A898';
    ctx.beginPath();
    ctx.moveTo(px, playerY + 2);
    ctx.bezierCurveTo(px + pr + 3, playerY + playerH * 0.44, px + pr + 3, playerY + playerH, px, playerY + playerH);
    ctx.bezierCurveTo(px - pr - 3, playerY + playerH, px - pr - 3, playerY + playerH * 0.44, px, playerY + 2);
    ctx.closePath();
    ctx.fill();

    // Top-left shine highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.ellipse(px - 7, playerY + 16, 4.5, 2.5, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(px - 9, playerY + 26, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 9, playerY + 26, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00332E';
    ctx.beginPath(); ctx.arc(px - 8.5, playerY + 26, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 9.5, playerY + 26, 2.6, 0, Math.PI * 2); ctx.fill();

    // Eye shines
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(px - 10, playerY + 24.5, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 8, playerY + 24.5, 1.2, 0, Math.PI * 2); ctx.fill();

    // Rosy cheeks
    ctx.fillStyle = 'rgba(242, 148, 106, 0.6)';
    ctx.beginPath(); ctx.arc(px - 14, playerY + 31, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px + 14, playerY + 31, 3.5, 0, Math.PI * 2); ctx.fill();

    // Happy smile
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(px, playerY + 27, 7, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.restore();

    if(isGameOver){
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '800 24px Outfit';
      ctx.textAlign = 'center';
      ctx.fillText('¡Partida terminada!', canvas.width/2, 160);
      ctx.font = '700 16px Nunito';
      ctx.fillText('Puntos obtenidos: ' + score, canvas.width/2, 195);
      ctx.font = '600 13px Nunito';
      ctx.fillText('Pulsa en la pantalla para jugar de nuevo', canvas.width/2, 230);
      return;
    }

    gameLoopId = requestAnimationFrame(gameUpdate);
  }

  // Touch and click controls
  const movePlayerTo = clientX => {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    playerX = Math.max(10, Math.min(canvas.width - playerW - 10, x - playerW/2));
  };

  canvas.addEventListener('pointerdown', (e)=>{
    if(isGameOver){
      isGameOver = false;
      score = 0;
      items = [];
      document.getElementById('g-score').textContent = 0;
      gameLoopId = requestAnimationFrame(gameUpdate);
      return;
    }
    movePlayerTo(e.clientX);
  });

  // PC: Mouse pointer tracking on canvas
  canvas.addEventListener('pointermove', (e)=>{
    if(!isGameOver && e.buttons === 1){
      movePlayerTo(e.clientX);
    }
  });

  // PC: Keyboard Arrow Keys & A/D
  const onGameKey = e => {
    if(R.page !== 'game-screen') return;
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
      playerX = Math.max(10, playerX - 25);
    } else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
      playerX = Math.min(canvas.width - playerW - 10, playerX + 25);
    } else if(e.key === ' ' && isGameOver){
      isGameOver = false; score = 0; items = [];
      document.getElementById('g-score').textContent = 0;
      gameLoopId = requestAnimationFrame(gameUpdate);
    }
  };
  window.addEventListener('keydown', onGameKey);

  const btnL = document.getElementById('g-left');
  const btnR = document.getElementById('g-right');
  if(btnL) btnL.addEventListener('click', ()=>{ playerX = Math.max(10, playerX - 35); playChime('tick'); });
  if(btnR) btnR.addEventListener('click', ()=>{ playerX = Math.min(canvas.width - playerW - 10, playerX + 35); playChime('tick'); });

  gameLoopId = requestAnimationFrame(gameUpdate);
}
